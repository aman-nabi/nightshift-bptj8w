<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<!--
  DEAD LETTER · app page
  File: app/src/index-v1.0.0.html (published as the page)

  CHANGELOG
  v1.0.0 (2026-10-04) first version: page shell (masthead, nav and view containers), design tokens,
    all CSS inline (views, diagram classes, sim classes, phone breakpoints, reduced motion),
    a "Clocking in..." loading state, a readable error panel if the engine fails, the engine
    scripts in contract order and the boot call.
-->
<title>Dead Letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Special+Elite&display=swap">
<style>
/* Layout: one dark reading column (820px) for the story and the explanation, widening to 1100px for
   sims and wide diagrams. A 16px side gutter at every width. Forum chrome and data in mono, the story
   in a book serif, notes on typewritten paper. Single committed dark theme (night shift). */
:root{
  color-scheme: dark;
  --bg:#0b0d0f; --bg-glass:rgba(11,13,15,.92); --surface:#12161a; --surface-2:#192026; --line:#28313a;
  --fg:#dedbd2; --muted:#959da4; --faint:#7a838b;
  --amber:#e2a23c; --amber-dim:rgba(226,162,60,.14);
  --red:#ef6a5f; --red-dim:rgba(239,106,95,.16);
  --green:#74c28e; --green-dim:rgba(116,194,142,.14);
  --paper:#d8ceaf; --paper-edge:#b9ad8b; --ink:#2a2316; --cork:#1f1914;
  --f-story:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-type:"Special Elite", "Courier New", Courier, monospace;
  --r:6px;
}
body{ background:var(--bg); color:var(--fg); }

/* ---------- base ---------- */
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-ui);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:0 64px;overflow-wrap:break-word;-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
a{color:var(--amber);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg text{font-family:var(--f-ui)}
.wrap{max-width:820px;margin-inline:auto;min-width:0}
.wide{max-width:1100px;margin-inline:auto;min-width:0}
.section{padding-block:40px 8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main{display:block;min-width:0}

/* ---------- masthead and nav ---------- */
.mast{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding-block:22px 10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.brand-mark{font-family:var(--f-type);font-size:24px;letter-spacing:.02em;color:var(--fg)}
.brand-board{color:var(--amber);font-weight:500}
.brand-tag{color:var(--muted);font-size:12px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg-glass);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;margin-top:12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tabs-in{display:flex;flex-wrap:wrap;gap:0 20px}
.tabs a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-block:12px;box-shadow:inset 0 -2px 0 transparent}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--amber)}
.tab-count{min-width:20px;padding:0 6px;border-radius:999px;border:1px solid var(--amber);background:var(--amber-dim);color:var(--amber);font-size:11px;line-height:16px;letter-spacing:0;text-align:center}

/* ---------- loading and errors ---------- */
.boot{padding-block:96px 48px;display:grid;gap:8px}
.boot-mark{font-family:var(--f-type);font-size:28px;letter-spacing:.02em;color:var(--fg)}
.boot-caret{display:inline-block;width:.55em;height:1em;margin-left:6px;background:var(--amber);vertical-align:-2px;animation:dl-blink 1.1s step-end infinite}
.boot-sub{color:var(--muted);font-size:13px}
.loading{padding-block:40px;color:var(--muted);font-family:var(--f-type);font-size:18px}
.loading-inline{color:var(--muted);font-size:13px}
.error-panel{margin-top:40px;border:1px solid var(--red);background:var(--red-dim);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.error-panel .eyebrow{color:var(--red)}
.error-panel h1,.error-panel h2{font-family:var(--f-story);font-size:24px;line-height:1.25}
.err-detail{margin:0;font-family:var(--f-ui);font-size:12px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--muted);white-space:pre-wrap;overflow-x:auto}
.inline-error{border:1px solid var(--red);border-radius:var(--r);background:var(--red-dim);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;font-size:13.5px}
@keyframes dl-blink{50%{opacity:0}}

/* ---------- section heads ---------- */
.sec-head{display:grid;gap:8px;margin-bottom:24px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.sec-head h1,.sec-head h2{font-family:var(--f-story);font-size:34px;line-height:1.15;font-weight:600}
.lede{color:var(--muted);max-width:62ch}
.h-small{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:12px}
.case-crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:14px}

/* ---------- buttons, chips, forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:8px 12px;font-size:13px;line-height:1.3;color:var(--fg);text-decoration:none;cursor:pointer;text-align:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.btn-primary:hover:not(:disabled){border-color:var(--amber);background:rgba(226,162,60,.22)}
.btn-danger{border-color:var(--red);color:var(--red);background:none}
.btn-danger:hover:not(:disabled){border-color:var(--red);background:var(--red-dim)}
.btn-ghost{background:none}
.btn-small{padding:4px 10px;font-size:12px}
.btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.btn[aria-pressed="true"]:disabled{opacity:1}
.btn.suggested{border-style:dashed;border-color:var(--muted)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-block;font-size:11.5px;line-height:1.5;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted);white-space:nowrap}
.chip.ok{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.chip.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.chip.bad{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.chip.core{color:var(--fg)}
.status-line{font-size:12.5px;color:var(--muted);min-height:1.6em}
.field{display:grid;gap:6px;margin:0;padding:0;border:0;min-width:0}
.field-k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0}
.field-help{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px}
input[type="date"],input[type="number"],input[type="text"],select{width:100%;max-width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--fg);font-size:14px;color-scheme:dark}
input[type="date"]:focus-visible,input[type="number"]:focus-visible,input[type="text"]:focus-visible,select:focus-visible{border-color:var(--amber)}
textarea{display:block;width:100%;font:inherit;font-size:14px;line-height:1.55;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;resize:vertical}
textarea:focus-visible{border-color:var(--amber);outline:2px solid var(--amber);outline-offset:1px}
textarea[readonly]{background:var(--bg);color:var(--muted);font-size:12px}
input[type="range"]{width:100%;accent-color:var(--amber)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--amber)}
.seg-opts{display:flex;flex-wrap:wrap;gap:6px}
.seg-opts input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg-opts label{flex:1 1 160px;display:grid;gap:2px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;font-size:13px;background:var(--surface-2)}
.seg-opts label small{font-size:11.5px;color:var(--muted)}
.seg-opts input:checked+label{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.seg-opts input:focus-visible+label{outline:2px solid var(--amber);outline-offset:2px}
.switch-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch-row label{font-size:13px;cursor:pointer}
.switch-state{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type="checkbox"][role="switch"]{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
input[type="checkbox"][role="switch"]::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .2s}
input[type="checkbox"][role="switch"]:checked{background:var(--green)}
input[type="checkbox"][role="switch"]:checked::before{transform:translateX(18px);background:var(--bg)}

/* ---------- the post ---------- */
.post{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 16px 8px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
.vote{background:none;border:0;cursor:pointer;color:var(--faint);font-size:14px;line-height:1;padding:4px}
.vote[aria-pressed="true"]{color:var(--amber)}
.vote-n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.post-body{min-width:0}
.post-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.flair{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--fg)}
.user{color:var(--fg)}
.op-tag{color:var(--amber);font-weight:600;font-size:11px;letter-spacing:.06em}
.post-title{font-family:var(--f-story);font-size:27px;line-height:1.22;margin-block:10px 18px;font-weight:600}
.post-title.small{font-size:22px;margin-block:8px 12px}
.story{font-family:var(--f-story);font-size:19px;line-height:1.62;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:64ch;min-width:0}
.story em{font-style:italic}
.beat-line{font-style:italic;color:var(--fg)}
.logline{margin:0;font-family:var(--f-ui);font-size:13px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:4px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--fg);max-width:100%}
.post-actions{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--muted)}

/* the typewritten note on paper */
.rules-note{margin:6px 0;background:var(--paper);color:var(--ink);font-family:var(--f-type);border-radius:2px;padding:22px 22px 18px;transform:rotate(-.7deg);box-shadow:0 10px 24px rgba(0,0,0,.45);position:relative;max-width:560px}
.rules-note::before{content:"";position:absolute;top:-10px;left:42%;width:92px;height:22px;background:rgba(216,206,175,.45);border:1px solid rgba(185,173,139,.6);transform:rotate(3deg)}
.note-title{font-family:var(--f-type);font-weight:400;font-size:17px;letter-spacing:.06em;margin-bottom:10px}
.rules-note ol,.rules-note ul{margin:0;padding-left:24px;display:grid;gap:7px;font-size:15.5px;line-height:1.45}
.rules-note p{font-size:15.5px;line-height:1.45}
.rules-note .sig{margin-top:12px;text-align:right;font-size:15px}

/* attachments and diagram figures */
.attach,.diagram{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;--dg-bg:var(--surface-2)}
.story .attach{font-family:var(--f-ui);font-size:14px;line-height:1.6}
.attach-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.scroll-x{overflow-x:auto;max-width:100%}
figcaption{font-family:var(--f-ui);font-size:12.5px;line-height:1.55;color:var(--muted);margin-top:10px;max-width:70ch}
.diagram-error{font-size:12.5px;color:var(--red)}
.fig-block{padding-top:24px}

/* comments */
.comments{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.comment{border-left:2px solid var(--line);padding-left:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}
.comment .comment{margin-top:10px}
.c-meta{font-size:12px;color:var(--muted)}
.comment p{font-size:14px;max-width:66ch}

/* reply to OP */
.reply-box{margin-top:28px;border:1px solid var(--amber);border-radius:var(--r);padding:18px;background:var(--surface)}
.reply-h{font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--amber)}
.reply-sub{color:var(--muted);margin-block:6px 14px;font-size:13px}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;font-size:13.5px;line-height:1.5}
.choice:hover{border-color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-dim)}
.choice-k{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:4px;font-weight:600;color:var(--amber)}
.reply-result{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.verdict{justify-self:start;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.reply-result[data-tone="bad"] .verdict{color:var(--red);background:var(--red-dim)}
.reply-result[data-tone="warn"] .verdict{color:var(--amber);background:var(--amber-dim)}
.reply-result[data-tone="ok"] .verdict{color:var(--green);background:var(--green-dim)}
.part2-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.part2{margin:0;font-family:var(--f-story);font-style:italic;font-size:18px;line-height:1.6;border-left:3px solid var(--line);padding-left:14px;max-width:62ch}
.senior{font-size:13.5px}
.senior strong{color:var(--amber);font-weight:600}
.reply-first{font-size:12.5px;color:var(--muted)}

/* ---------- diagrams (classes emitted by engine/diagram.js; colors come only from here) ----------
   Tone and state colors travel as inherited custom properties, so they work whether the class sits on a
   <g> or on the shape itself. Rules are qualified by element so a group never passes fill or stroke to its
   text, and there are no bare element rules that would override fill="currentColor" on arrowheads.
   The label halo color comes from --dg-bg, set by the container (.attach, .diagram, .sim-canvas). */
.dg{display:block;width:100%;height:auto;margin-inline:auto;color:var(--faint)}
.dg text{font-family:var(--f-ui);fill:var(--fg);stroke:none;font-size:12px}
.tone-ok{--tone:var(--green);--tone-dim:var(--green-dim)}
.tone-warn{--tone:var(--amber);--tone-dim:var(--amber-dim)}
.tone-bad{--tone:var(--red);--tone-dim:var(--red-dim)}
.tone-muted{--tone:var(--faint);--tone-dim:rgba(122,131,139,.12)}
.tone-accent{--tone:var(--amber);--tone-dim:var(--amber-dim)}
.dg rect.dg-group,.dg .dg-group rect{fill:none;stroke:var(--line);stroke-dasharray:5 5}
.dg .dg-group-label{fill:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.dg .dg-node rect,.dg .dg-node ellipse,.dg .dg-node path,.dg .dg-node circle,.dg .dg-node polygon{fill:var(--n-fill,var(--surface-2));stroke:var(--n-stroke,var(--line));stroke-width:1.5;transition:stroke .2s,fill .2s}
.dg .dg-label{fill:var(--n-label,var(--fg));font-size:13px;font-weight:600}
.dg .dg-sub{fill:var(--n-text,var(--muted));font-size:12px}
.dg .dg-meta{fill:var(--muted);font-size:11px}
.dg-node[role="button"]{cursor:pointer}
.dg-node:focus{outline:none}
.dg-node:focus-visible{--n-stroke:var(--amber)}
.dg .dg-node:focus-visible rect,.dg .dg-node:focus-visible ellipse,.dg .dg-node:focus-visible path,.dg .dg-node:focus-visible circle{stroke-width:3}
.dg-node[role="button"]:not([class*="st-"]):not([class*="tone-"]):hover{--n-stroke:var(--muted)}
.dg-node.st-ok,.dg-node.tone-ok{--n-stroke:var(--green)}
.dg-node.st-warn,.dg-node.tone-warn{--n-stroke:var(--amber);--n-fill:var(--amber-dim);--n-text:var(--amber)}
.dg-node.st-bad,.dg-node.tone-bad{--n-stroke:var(--red);--n-fill:var(--red-dim);--n-text:var(--red)}
.dg-node.st-zombie{--n-stroke:var(--red);--n-fill:var(--red-dim);--n-text:var(--red)}
.dg-node.st-muted,.dg-node.tone-muted{opacity:.45}
.dg-node.st-accent,.dg-node.tone-accent{--n-stroke:var(--amber);--n-label:var(--amber)}
.dg .dg-node.st-bad .dg-sub,.dg .dg-node.st-zombie .dg-sub{font-weight:600}
.dg .dg-node.st-zombie rect,.dg .dg-node.st-zombie ellipse,.dg .dg-node.st-zombie path{stroke-dasharray:6 3;animation:dl-flicker 1.1s steps(2) infinite}
.dg .dg-edge{fill:none;stroke:var(--tone,currentColor);stroke-width:1.5}
.dg .dg-edge.cut{stroke:var(--red);stroke-dasharray:4 4;opacity:.55}
.dg .dg-edge-label{fill:var(--tone,var(--muted));font-size:11px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg .dg-note{fill:var(--tone,var(--fg));font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
/* sequence */
.dg rect.dg-lane,.dg .dg-lane rect{fill:var(--surface);stroke:var(--line)}
.dg text.dg-lane,.dg .dg-lane text{fill:var(--fg);font-size:12px;font-weight:600}
.dg line.dg-lifeline,.dg path.dg-lifeline,.dg .dg-lifeline line{fill:none;stroke:var(--faint);stroke-dasharray:3 5}
.dg line.dg-msg,.dg path.dg-msg,.dg polyline.dg-msg,.dg .dg-msg line,.dg .dg-msg path,.dg .dg-msg polyline{fill:none;stroke:var(--tone,var(--muted));stroke-width:1.4}
.dg text.dg-msg,.dg .dg-msg text{fill:var(--tone,var(--fg));font-size:11.5px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg rect.dg-span,.dg .dg-span rect{fill:var(--tone-dim,var(--amber-dim));stroke:var(--tone,var(--amber));stroke-dasharray:4 3}
.dg text.dg-span,.dg .dg-span text{fill:var(--tone,var(--fg));font-size:11.5px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg rect.dg-notebox,.dg .dg-notebox rect{fill:var(--surface);stroke:var(--tone,var(--amber))}
.dg text.dg-notebox,.dg .dg-notebox text{fill:var(--fg);font-size:11.5px}
.dg .dg-notebox .dg-sub,.dg text.dg-notebox.dg-sub{fill:var(--tone,var(--amber))}
.dg rect.dg-outcome,.dg .dg-outcome rect{fill:var(--tone-dim,var(--surface));stroke:var(--tone,var(--line))}
.dg text.dg-outcome,.dg .dg-outcome text{fill:var(--fg);font-size:11.5px;font-weight:600}
/* timeline */
.dg line.dg-ticks,.dg path.dg-ticks,.dg .dg-ticks line,.dg .dg-ticks path{fill:none;stroke:var(--tone,var(--green))}
.dg line.dg-flat,.dg path.dg-flat,.dg .dg-flat line,.dg .dg-flat path{fill:none;stroke:var(--tone,var(--red));stroke-width:1.5}
.dg rect.dg-gap,.dg .dg-gap rect{fill:var(--tone-dim,var(--red-dim));stroke:none}
.dg text.dg-gap,.dg .dg-gap text,.dg text.dg-flat,.dg .dg-flat text{fill:var(--tone,var(--red));font-size:11px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg line.dg-marker,.dg path.dg-marker,.dg .dg-marker line,.dg .dg-marker path{fill:none;stroke:var(--tone,var(--amber));stroke-width:1.2;stroke-dasharray:4 4}
.dg text.dg-marker,.dg .dg-marker text{fill:var(--tone,var(--amber));font-size:11px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg line.dg-axis,.dg path.dg-axis,.dg .dg-axis line,.dg .dg-axis path{fill:none;stroke:var(--faint);stroke-width:1}
.dg text.dg-axis,.dg .dg-axis text{fill:var(--muted);font-size:11px}
/* moving dots (drawn by sims in the diagram's dots layer) */
.dg .dot{fill:var(--fg);transition:fill .2s}
.dg .dot-req{fill:var(--fg);opacity:.85}
.dg .dot-wait{fill:var(--amber)}
.dg .dot-fail{fill:var(--red)}
.dg .dot-ok{fill:var(--green)}
.dg .dot-bad{fill:var(--red-dim);stroke:var(--red);stroke-width:2.2}
.dg .dot-accent{fill:var(--amber)}
@keyframes dl-flicker{0%{opacity:1}50%{opacity:.55}}

/* ---------- sims (layout built by engine/sim.js) ---------- */
.sim-section .sec-head{margin-bottom:18px}
.sim-host{min-width:0}
.sim-placeholder{border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:28px 18px;display:grid;gap:12px;justify-items:start}
.sim-placeholder p{color:var(--muted);font-size:13px}
.try{font-size:12.5px;color:var(--muted);line-height:1.55;max-width:80ch;margin-top:12px}
.try strong{color:var(--fg);font-weight:600}
.sim{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.sim-stage{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.sim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 4px 8px;font-size:12px;color:var(--muted)}
.sim-clock{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--amber);letter-spacing:.04em}
.sim-canvas{overflow-x:auto;border-radius:4px;background:var(--bg);min-width:0;--dg-bg:var(--bg)}
.sim-canvas .dg{min-width:620px}
.sim-canvas pre,.sim-canvas code{font-family:var(--f-ui);font-size:12.5px}
.sim-canvas table{border-collapse:collapse;font-size:12.5px}
.sim-canvas th,.sim-canvas td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.sim-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.sim-stats:empty{display:none}
.sim-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.sim-stat-v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sim-stat-k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sim-stat.ok .sim-stat-v{color:var(--green)}
.sim-stat.warn .sim-stat-v{color:var(--amber)}
.sim-stat.bad .sim-stat-v{color:var(--red)}
.sim-info{margin-top:12px;border-left:3px solid var(--amber);padding:6px 12px;font-size:13px;min-height:52px}
.sim-info:empty{display:none}
.sim-info strong{color:var(--amber);font-weight:600}
.sim-controls{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-wrap:wrap;align-content:start;gap:12px 8px;min-width:0}
.sim-ctl{flex:1 1 100%;display:grid;gap:6px;min-width:0;margin:0;padding:0;border:0}
.sim-ctl:has(> button:only-child){flex-basis:calc(50% - 4px)}
.sim-ctl label,.sim-ctl legend,.sim-ctl .sim-ctl-k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;padding:0}
.sim-ctl output{color:var(--fg);font-variant-numeric:tabular-nums;margin-left:auto}
.sim-ctl button{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:8px 10px;font-size:13px;line-height:1.3;color:var(--fg);cursor:pointer}
.sim-ctl button:hover:not(:disabled){border-color:var(--muted)}
.sim-ctl button:disabled{opacity:.4;cursor:not-allowed}
.sim-ctl button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.sim-ctl select{width:100%}
.sim-log{flex:1 1 100%;list-style:none;margin:0;padding:10px 0 0;border-top:1px dashed var(--line);display:grid;gap:6px;font-size:12px;max-height:280px;overflow-y:auto;min-width:0}
.sim-log:empty{display:none}
.sim-log li{line-height:1.45}
.sim-log time,.sim-log .t{color:var(--faint);font-variant-numeric:tabular-nums;margin-right:8px}
.sim-log li.t-ok{color:var(--green)}
.sim-log li.t-warn{color:var(--amber)}
.sim-log li.t-bad{color:var(--red)}

/* ---------- what actually happened ---------- */
.oneline{font-family:var(--f-story);font-size:21px;line-height:1.45;font-style:italic;max-width:56ch}
.rule-tie{font-size:12.5px;color:var(--amber)}
.steps{margin:0;padding-left:22px;display:grid;gap:12px;max-width:66ch}
.steps li{padding-left:4px}
.steps strong{color:var(--fg)}
.block{margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.block h3{font-size:16px}
.block p{max-width:66ch}
.limits{margin:0;padding-left:20px;display:grid;gap:6px;max-width:66ch}
.table-wrap{overflow-x:auto;max-width:100%}
.tradeoff{width:100%;border-collapse:collapse;font-size:13px}
.tradeoff th,.tradeoff td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.tradeoff th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.pull{font-family:var(--f-story);font-size:24px;line-height:1.35;border-left:3px solid var(--amber);padding-left:16px;max-width:40ch}
.pull-by{font-size:12px;color:var(--muted)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px;margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;min-width:0}
.panel h3{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--amber)}
.panel p,.panel li{font-size:13.5px}
.panel ul{margin:0;padding-left:18px;display:grid;gap:4px}
.src-link{font-size:12.5px}
.sources ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}

/* ---------- words, at work, pin it, notes box, close ---------- */
.terms{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.terms summary{cursor:pointer;padding:12px 14px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber)}
.term-list{margin:0;padding:0 14px 14px;display:grid;gap:10px}
.term-list dt{font-weight:600;color:var(--fg)}
.term-list dd{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.at-work{border-left:3px solid var(--amber);padding:4px 0 4px 14px}
.part-head{font-family:var(--f-story);font-size:26px;line-height:1.2}
.recall{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.recall-q{font-family:var(--f-story);font-size:18px;line-height:1.5;max-width:64ch}
.recall > .btn,.recall > .btn-row{justify-self:start}
.opts{display:grid;gap:6px}
.opt{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:13.5px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.opt.right{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.opt.wrong{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.feedback{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-size:13.5px;background:var(--surface)}
.feedback:empty{display:none}
.marks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.marks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.mark-ok{color:var(--green);font-weight:600}
.mark-no{color:var(--red);font-weight:600}
.model{border-left:3px solid var(--line);padding-left:12px;display:grid;gap:4px}
.model p{font-family:var(--f-story);font-size:16.5px;line-height:1.55;max-width:64ch}
.verdict-line{font-weight:600}
.verdict-line.ok{color:var(--green)}
.verdict-line.bad{color:var(--red)}
.next-line{font-size:13px;color:var(--green)}
.ai-notice{font-size:12.5px;color:var(--muted);border-left:3px solid var(--amber);padding:2px 0 2px 10px}
.close-box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.close-box.done{border-color:var(--green)}
.teaser{font-family:var(--f-story);font-style:italic;font-size:18px;line-height:1.55;border-left:3px solid var(--amber);padding-left:14px;max-width:62ch}

/* ---------- tonight ---------- */
.pace-box{border-left:3px solid var(--green);padding:4px 0 4px 14px;display:grid;gap:6px;margin-bottom:28px}
.pace-box[data-status="behind"],.pace-box[data-status="past-target"]{border-left-color:var(--amber)}
.pace{font-family:var(--f-story);font-size:22px;line-height:1.35;max-width:52ch}
.pace-sub{font-size:12.5px;color:var(--muted)}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:28px}
.callout.due{border-color:var(--amber)}
.callout p{max-width:56ch}
.sessions{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.session{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.session.ready:hover{border-color:var(--muted)}
.session.ready:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.session.planned{opacity:.78}
.session-k{font-family:var(--f-type);font-size:18px;color:var(--amber);line-height:1.3}
.session-title{font-family:var(--f-story);font-size:20px;line-height:1.25}
.session-title a{color:var(--fg);text-decoration:none}
.session-title a::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.session-title a:focus-visible{outline:none}
.session-setting{color:var(--muted);font-size:13px;margin-block:2px 8px}
.more-line{margin-top:16px;font-size:13px;color:var(--muted)}
.storage-line{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.card-panel{background:var(--surface);border:1px solid var(--amber);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

/* ---------- seasons ---------- */
.seasons{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.season-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.season-block.here{border-color:var(--amber)}
.season-block.solved{border-color:var(--green)}
.season-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start}
.s-n{font-family:var(--f-type);font-size:20px;color:var(--amber)}
.season-head h2{font-family:var(--f-story);font-size:20px;line-height:1.25;font-weight:600}
.s-rank{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.s-blurb{font-size:13px;color:var(--muted);margin-top:4px;max-width:66ch}
.season-items{list-style:none;margin:12px 0 0;padding:12px 0 0 56px;border-top:1px dashed var(--line);display:grid;gap:8px}
.season-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13.5px}
.si-mark{color:var(--faint);text-align:center}
.si-mark.done{color:var(--green);font-weight:600}
.si-mark.ready{color:var(--amber)}
.si-title a{color:var(--fg)}
.si-kind{display:block;font-size:11.5px;color:var(--muted)}
.season-item .chips{justify-content:flex-end}
.season-empty{font-size:12.5px;color:var(--faint)}

/* ---------- rulebook ---------- */
.rulebook{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rule{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rule-n{font-family:var(--f-type);font-size:22px;color:var(--amber);line-height:1}
.rule-text{font-family:var(--f-type);font-size:16px;line-height:1.4}
.rule-why{font-size:13px;color:var(--muted);margin-top:6px;max-width:64ch}
.rule-why .tag{color:var(--fg)}
.redacted{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.redacted span{display:block;height:12px;background:var(--line);border-radius:2px}
.rule-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.rule.fading{border-color:var(--amber)}
.rule.fading .rule-text{opacity:.62}
.rule.locked .rule-text{opacity:.85}
.rule.known{border-color:var(--green)}

/* ---------- cold cases ---------- */
.review-progress{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.post.post-update{grid-template-columns:minmax(0,1fr);padding:16px 18px}
.post-update .story{font-size:18px}
.gp-reply{border-left:2px solid var(--amber);padding-left:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.gp-reply .c-meta{font-family:var(--f-ui)}
.review-answer{margin-top:16px}
.shift-over{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px;display:grid;gap:10px}
.shift-over h2{font-family:var(--f-type);font-weight:400;font-size:26px;letter-spacing:.02em}

/* ---------- evidence board (built by ui.js) ---------- */
.board{margin:0;min-width:0}
.board .scroll-x{border-radius:var(--r)}
.board svg{display:block;width:100%;height:auto;margin-inline:auto}
.bd-cork{fill:var(--cork);stroke:var(--line)}
.bd-col{fill:var(--muted);font-size:11px;letter-spacing:.08em}
.bd-string{fill:none;stroke:var(--red);stroke-width:1.6;opacity:.85}
.bd-lbl{fill:var(--fg);font-size:11px;paint-order:stroke;stroke:var(--cork);stroke-width:5px;stroke-linejoin:round}
.bd-card rect{fill:var(--paper);stroke:var(--paper-edge)}
.bd-pin{fill:var(--red)}
.bd-title{fill:var(--ink);font-size:12.5px;font-weight:600}
.bd-sub{fill:var(--ink);font-size:10.5px;opacity:.75}
.bd-card.fading rect{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 3}
.bd-card.fading .bd-title{opacity:.7}
.bd-crack{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.board-list{margin-top:14px}
.board-list ul{margin:0;padding:0 14px 14px 32px;display:grid;gap:4px;font-size:13px}

/* ---------- notes ---------- */
.notes-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.note-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.note-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.note-head a{font-family:var(--f-story);font-size:18px;color:var(--fg)}
.note-text{font-family:var(--f-story);font-size:16.5px;line-height:1.55;white-space:pre-wrap}

/* ---------- settings ---------- */
.settings-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px}
.settings-group > h2{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber)}
.settings-group.danger{border-color:rgba(239,106,95,.45)}
.settings-group.danger > h2{color:var(--red)}
.confirm{border:1px solid var(--red);background:var(--red-dim);border-radius:var(--r);padding:14px;display:grid;gap:10px}

/* ---------- phones ---------- */
@media (max-width: 900px){
  .sim{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 520px){
  .tabs-in{gap:0 14px}
  .tabs a{padding-block:9px}
  .post{grid-template-columns:30px minmax(0,1fr);padding-right:12px}
  .post-title{font-size:22px}
  .story{font-size:17.5px}
  .sec-head h1,.sec-head h2{font-size:27px}
  .reply-box{padding:14px}
  .session{grid-template-columns:minmax(0,1fr)}
  .season-head{grid-template-columns:36px minmax(0,1fr)}
  .season-head > .chip{grid-column:2;justify-self:start}
  .season-items{padding-left:0}
  .season-item{grid-template-columns:22px minmax(0,1fr)}
  .season-item .chips{grid-column:2;justify-content:flex-start}
  .rule{grid-template-columns:28px minmax(0,1fr)}
  .pull{font-size:21px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="mast wrap">
  <div class="brand"><span class="brand-mark" id="brand-name">nocturne</span><span class="brand-board" id="brand-board">/n/nightshift</span></div>
  <p class="brand-tag">Stories from people who work while you sleep.</p>
</header>

<nav class="tabs" id="nav" aria-label="Sections" hidden>
  <div class="tabs-in wide" id="nav-links"></div>
</nav>

<main id="view">
  <section class="wrap boot" role="status" aria-live="polite">
    <p class="boot-mark">Clocking in...<span class="boot-caret" aria-hidden="true"></span></p>
    <p class="boot-sub">Pulling tonight's files.</p>
  </section>
</main>

<noscript>
  <div class="wrap error-panel"><p class="eyebrow">Couldn't clock in</p><p>Dead Letter needs JavaScript to run. Turn it on and reload the page.</p></div>
</noscript>

<script src="engine/core.js"></script>
<script src="engine/diagram.js"></script>
<script src="engine/sim.js"></script>
<script src="engine/ui.js"></script>
<script>
(function () {
  "use strict";
  function fail(err) {
    var view = document.getElementById("view");
    if (!view) return;
    while (view.firstChild) view.removeChild(view.firstChild);
    var sec = document.createElement("section");
    sec.className = "wrap";
    var panel = document.createElement("div");
    panel.className = "error-panel";
    panel.setAttribute("role", "alert");
    var eb = document.createElement("p");
    eb.className = "eyebrow";
    eb.textContent = "Couldn't clock in";
    var h = document.createElement("h1");
    h.textContent = "The night shift didn't start.";
    var p = document.createElement("p");
    p.textContent = "Reload the page to try again. Nothing you saved has been changed.";
    var pre = document.createElement("pre");
    pre.className = "err-detail";
    pre.textContent = (err && err.message) ? String(err.message) : String(err || "Unknown error");
    panel.appendChild(eb); panel.appendChild(h); panel.appendChild(p); panel.appendChild(pre);
    sec.appendChild(panel);
    view.appendChild(sec);
  }
  var DL = window.DL;
  if (!DL || !DL.ui || typeof DL.ui.boot !== "function") {
    fail(new Error("The app's engine files didn't load (engine/core.js, engine/diagram.js, engine/sim.js, engine/ui.js)."));
    return;
  }
  try {
    var started = DL.ui.boot();
    if (started && typeof started.then === "function") {
      started.then(null, function (err) {
        if (DL.ui && typeof DL.ui.showError === "function") DL.ui.showError(err); else fail(err);
      });
    }
  } catch (err) {
    if (DL.ui && typeof DL.ui.showError === "function") DL.ui.showError(err); else fail(err);
  }
})();
</script>
</body>
</html>
