.fs-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-top:28px}
.fs .btn-start:disabled{opacity:.6;cursor:default}
.fs-new{margin-top:18px;font-family:var(--f-ui);font-size:var(--t-xs);color:var(--muted)}
.fs-new a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.fs-new a:hover{color:var(--fg)}
/* number inputs: no native spinners anywhere */
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
/* date inputs elsewhere (Settings): flat, hairline, dark picker; the focus rules above still win (higher specificity) */
input[type="date"]{height:40px;background:var(--surface);border:1px solid var(--hair-2);border-radius:8px;color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer}
@media (max-width: 699px){
  .fs{padding-top:24px}
  .fs-title{line-height:1.1}
  .fs-q{margin-top:26px}
  .fs-q + .fs-q{padding-top:24px}
  /* Clock in stays in the flow, full width (the phone rule above pins .btn-start for the Tonight hero) */
  .fs .btn-start{position:static;width:100%}
  .fs-actions .status-line{flex-basis:100%}
}
@media (max-width: 520px){
  .fs-plans{grid-template-columns:minmax(0,1fr)}
}

/* ---------- Case page: case bar, Words, phone bar (v2.0.0; dot rail and focus mode removed in v3.0.0) ---------- */
:root{--casebar-h:54px;--stepnav-h:74px}
/* full-width bars inside the column: border-image paints past the box without causing a sideways scroll */
.case-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:0 22px;height:var(--casebar-h);padding-top:2px;min-width:0;font-family:var(--f-ui);font-size:var(--t-sm);color:var(--muted);border-image:linear-gradient(var(--bar-bg) calc(100% - 1px),var(--bar-line) 0) fill 0 / 0 / 0 100vmax}
body:not(.lesson) .case-bar{top:calc(env(safe-area-inset-top,0px) + var(--topbar-h) + 1px)}
.cb-back{flex:none;color:var(--muted);text-decoration:none;white-space:nowrap}
.cb-back:hover{color:var(--fg);text-decoration:none}
.cb-where{flex:1 1 auto;min-width:0;display:flex;justify-content:center;align-items:baseline;gap:12px;white-space:nowrap;overflow:hidden}
.cb-where .q-code{font-size:var(--t-xs)}
.cb-title{min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-story);font-style:italic;font-size:var(--t-ui);color:var(--muted)}
.cb-part{flex:none}
/* the Reading button (was "Aa"): an icon plus "Reading" on desktop, the icon only on phones; it opens .rd-panel */
.cb-aa{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:36px;background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:var(--t-sm);line-height:1.2;color:var(--muted)}
.cb-aa:hover{border-color:var(--muted);color:var(--fg)}
.cb-aa[aria-expanded="true"]{border-color:var(--amber);color:var(--amber)}
.cb-aa-icon{flex:none;display:inline-grid;place-items:center;font-family:var(--f-story);font-size:var(--t-ui);line-height:1}
.cb-aa-label{white-space:nowrap}
.case-bar .clock{font-size:var(--t-sm)}
.case-bar kbd,.words-pill kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border:1px solid var(--line);border-radius:4px;font-family:var(--f-mono);font-size:var(--t-2xs);line-height:1;color:var(--muted)}
/* parts land below the sticky case bar when scrolled to */
[data-part]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--casebar-h) + 16px)}
body:not(.lesson) [data-part]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--topbar-h) + var(--casebar-h) + 17px)}

/* Words: a pill at the bottom right that opens the glossary popover above it */
.words-pill{position:fixed;z-index:35;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid rgba(226,162,60,.55);border-radius:999px;background:var(--surface-2);font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.3;color:var(--fg);box-shadow:0 0 0 4px rgba(226,162,60,.08),0 10px 30px rgba(0,0,0,.45)}
.words-pill:hover,.words-pill[aria-expanded="true"]{border-color:var(--amber)}
.words-pill b{font-weight:500;color:var(--amber)}
.words-pop{position:fixed;z-index:36;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:320px;max-width:calc(100% - 32px);max-height:min(70vh,560px);overflow-y:auto;padding:18px 20px 16px;background:var(--pop-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop-shadow)}
.wp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 10px;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wp-head span{letter-spacing:.04em;color:var(--amber)}
.wp-list{display:flex;flex-direction:column;margin:0;padding:0}
.wp-item{padding:9px 0;border-top:1px solid var(--hair)}
.wp-item dt{font-family:var(--f-story);font-size:var(--t-body);line-height:1.3;color:var(--fg)}
.wp-item dd{margin:2px 0 0;font-family:var(--f-story);font-size:var(--t-body);line-height:1.6;color:var(--muted)}
.wp-open{display:block;width:100%;margin-top:6px;padding:10px 0 0;border:0;border-top:1px solid var(--hair);background:none;text-align:left;font-size:var(--t-sm);color:var(--amber);cursor:pointer}
.wp-open:hover{text-decoration:underline;text-underline-offset:3px}

/* the phone bottom bar: Words plus Next part (shown under 700px only) */
.case-bottom{display:none}

@media (max-width: 699px){
  :root{--casebar-h:48px;--stepnav-h:70px}
  .case-bar{gap:0 12px}
  .cb-title{display:none}
  .cb-where{justify-content:flex-start;gap:8px}
  .cb-aa{width:44px;min-height:44px;padding:0;justify-content:center}
  .cb-aa-label{display:none}   /* phones: the Reading button shows its "Aa" icon only (keep an aria-label on the button) */
  .words-pill{display:none}
  .words-pop{left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:auto;max-width:none;max-height:62vh;border-width:1px 0 0;border-radius:16px 16px 0 0;padding:18px calc(20px + env(safe-area-inset-right,0px)) 16px calc(20px + env(safe-area-inset-left,0px))}
  .case-bottom{position:fixed;z-index:34;left:0;right:0;bottom:0;display:flex;gap:10px;padding:20px calc(16px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));background:linear-gradient(var(--bg-fade),var(--bg-deep) 32%)}
  .cbb-words{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-family:var(--f-ui);font-size:var(--t-sm);color:var(--fg);white-space:nowrap}
  .cbb-words b{font-weight:500;color:var(--amber)}
  .cbb-next{flex:1 1 auto;display:block;min-width:0;min-height:48px;padding:14px 16px;border:0;border-radius:10px;background:var(--amber);color:var(--on-accent);font-family:var(--f-ui);font-weight:600;font-size:var(--t-ui);line-height:1.4;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 0 1px rgba(226,162,60,.45),0 10px 30px rgba(226,162,60,.16)}
  .cbb-next:focus-visible,.cbb-words:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  main#view:has(.case-bottom){padding-bottom:88px}
}

/* ---------- Seasons: summary line and timeline (v2.0.0) ---------- */
.season-sum{font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.6;color:var(--muted)}
.season-sum b{font-weight:500;color:var(--muted)}
.timeline{position:relative;gap:0;padding-left:44px}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:0;width:1px;background:var(--line)}
.timeline > .season-block{position:relative;padding:0 0 30px;background:none;border:0;border-radius:0}
.timeline > .season-block:last-child{padding-bottom:8px}
.tl-dot{position:absolute;left:-44px;top:3px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg-deep);opacity:.75}
.season-block.solved > .tl-dot{opacity:1;border-color:var(--green);background:var(--ok-bg)}
.season-block.solved > .tl-dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.season-block.here > .tl-dot{opacity:1;border-color:var(--amber);box-shadow:0 0 0 5px rgba(226,162,60,.1)}
.season-block.here > .tl-dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber-glow)}
.course-group[data-course="lt"] .season-block.here > .tl-dot{border-color:var(--cyan);box-shadow:0 0 0 5px rgba(95,179,201,.1)}
.course-group[data-course="lt"] .season-block.here > .tl-dot::after{background:var(--cyan);box-shadow:0 0 8px rgba(95,179,201,.45)}
.timeline > .season-block.solved .s-n{color:var(--green)}
.timeline > .season-block:not(.here):not(.solved) .season-head h2,.timeline > .season-block:not(.here):not(.solved) .season-head h3{color:var(--muted)}
.timeline .season-items{margin-top:14px;padding:0;border-top:0;gap:0}
/* rows with a code (any season list) become a flex row, so extra or missing children never misplace columns */
.season-item:has(> .q-code),.timeline .season-item{display:flex;align-items:baseline;gap:12px}
.timeline .season-item{padding:9px 0;border-top:1px solid var(--hair)}
.season-item:has(> .q-code) > .si-mark,.timeline .season-item > .si-mark{flex:none;width:18px}
.season-item:has(> .q-code) > .q-code,.timeline .season-item > .q-code{flex:none;min-width:52px;font-size:var(--t-xs)}
.season-item:has(> .q-code) > .si-title,.timeline .season-item > .si-title{flex:1 1 0;min-width:0}
.season-item:has(> .q-code) > .chips,.timeline .season-item > .chips{flex:none}
.season-item:has(> .q-code) > .q-min,.timeline .season-item > .q-min{flex:none;margin-left:auto}
.season-item.is-next{margin:2px -12px;padding:11px 12px;border-radius:8px;border-top-color:transparent;background:rgba(226,162,60,.07)}
.season-item.is-next + .season-item{border-top-color:transparent}
.season-item.is-next .si-mark{color:var(--amber)}
.season-item.is-next .q-tag{font-family:var(--f-mono);font-size:var(--t-2xs);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.course-group[data-course="lt"] .season-item.is-next{background:rgba(95,179,201,.07)}
.course-group[data-course="lt"] .season-item.is-next .si-mark,.course-group[data-course="lt"] .season-item.is-next .q-tag{color:var(--cyan)}

/* ---------- The journey: home path, marker, landmarks, Continue (v3.0.0, mockup guided-flow-v1.0.0.html) ---------- */
/* One vertical line at --jr-line runs through every row of .jr-path; rows indent by --jr-x and their dots sit on the
   line, centred at --jr-dot-c from the top of the row. The past is a solid dim amber line, everything from the marker
   on is dashed. Flat: no gradients, glows or box shadows. */
.journey{padding-top:32px}
.jr-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 16px;margin-bottom:22px;min-width:0}
.jr-kicker{font-family:var(--f-story);font-style:italic;font-size:var(--t-xl);line-height:1.2;color:var(--fg)}
.jr-count{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.jr-path{--jr-x:52px;--jr-line:19px;--jr-dot-c:25px;position:relative;list-style:none;margin:0;padding:0;min-width:0}
.jr-path > li{position:relative;min-width:0;padding:6px 0 6px var(--jr-x)}
.jr-path > li::before{content:"";position:absolute;left:var(--jr-line);top:0;bottom:0;width:2px;background:rgba(226,162,60,.3)}
.jr-path > li:first-child::before{top:var(--jr-dot-c)}
.jr-path > li:last-child::before{bottom:auto;height:var(--jr-dot-c)}
.jr-path > li:only-child::before{display:none}
.jr-path > li.jr-marker::before,.jr-path > .jr-marker ~ li::before{width:0;background:none;border-left:2px dashed var(--line)}

/* finished seasons, one line each, and the night dividers */
.jr-fold{font-size:var(--t-sm);line-height:1.5;color:var(--muted)}
.jr-path > li.jr-fold{padding-top:8px;padding-bottom:8px}
.jr-path > li.jr-fold:first-child::before{top:50%}
.jr-fold::after{content:"";position:absolute;z-index:1;left:calc(var(--jr-line) + 1px - 5px);top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:rgba(226,162,60,.55)}
.jr-path > li.jr-night{padding-top:18px;padding-bottom:4px;font-family:var(--f-mono);font-size:var(--t-2xs);line-height:1.5;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.jr-path > .jr-marker ~ li.jr-night{color:var(--fg)}

/* stops: --kc is the stop's kind colour (dot, landmark side rule, "about" date) */
.jr-stop{--kc:var(--amber);--d:14px;cursor:pointer}
.jr-stop[data-kind="check"]{--kc:var(--muted)}
.jr-stop[data-kind="project"]{--kc:var(--green)}
.jr-stop[data-kind="interview"]{--kc:var(--amber)}
.jr-stop[data-kind="season"]{--kc:var(--muted)}
.jr-stop[data-kind="lesson"][data-course="lt"],.jr-stop[data-kind="interview"][data-course="lt"]{--kc:var(--cyan)}
.jr-dot{position:absolute;z-index:1;left:calc(var(--jr-line) + 1px - var(--d) / 2);top:calc(var(--jr-dot-c) - var(--d) / 2);width:var(--d);height:var(--d);box-sizing:border-box;border:2px solid var(--kc,var(--amber));border-radius:50%;background:var(--bg-deep)}
/* a stop written without a .jr-dot (the memory-check line) still gets one on the line */
.jr-stop:not(:has(> .jr-dot))::after{content:"";position:absolute;z-index:1;left:calc(var(--jr-line) + 1px - var(--d) / 2);top:calc(var(--jr-dot-c) - var(--d) / 2);width:var(--d);height:var(--d);box-sizing:border-box;border:2px solid var(--kc);border-radius:50%;background:var(--bg-deep)}
.jr-stop[data-kind="check"] .jr-dot,.jr-stop[data-kind="check"]:not(:has(> .jr-dot))::after{border-style:dashed;border-width:1.5px}
/* done: the dot is filled (ticked for lessons and checks), the row is faded */
.jr-stop.is-done .jr-dot,.jr-stop.is-done:not(:has(> .jr-dot))::after{background:var(--kc)}
.jr-stop.is-done:not(.is-landmark) .jr-dot::after{content:"";position:absolute;left:calc(50% - 2px);top:calc(50% - 4.5px);width:4px;height:7px;box-sizing:border-box;border:solid var(--bg-deep);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.jr-stop.is-done > .jr-dot,.jr-stop.is-done > .jr-body{opacity:.55;transition:opacity .15s}
.jr-stop.is-done:hover > .jr-body{opacity:.85}
.jr-body{display:block;min-width:0;padding:7px 10px;border:1px solid transparent;border-radius:10px}
.jr-stop:hover > .jr-body{background:var(--surface)}
.jr-body > .q-code{margin-right:4px}
.jr-title{font-family:var(--f-story);font-size:var(--t-body);line-height:1.3;color:var(--fg)}
.jr-sub{display:block;margin-top:1px;font-size:var(--t-sm);line-height:1.5;color:var(--muted)}
.jr-when{display:block;font-family:var(--f-mono);font-size:var(--t-2xs);line-height:1.6;letter-spacing:.14em;text-transform:uppercase;color:var(--kc,var(--faint))}
/* the memory-check stop: text straight in the row */
.jr-check{font-size:var(--t-sm);line-height:1.5;color:var(--muted)}
.jr-path > li.jr-check:not(:has(> .jr-body)){padding:14px 10px 14px calc(var(--jr-x) + 10px)}

/* landmarks: a flat card with the kind colour down its left edge, and a dot shape per kind */
.jr-stop.is-landmark{--d:22px}
.jr-stop.is-landmark > .jr-body{padding:10px 12px;border-color:var(--hair-2);border-left:2px solid var(--kc);background:var(--surface)}
.jr-stop.is-landmark:hover > .jr-body{border-color:var(--line);border-left-color:var(--kc)}
/* weekend project: a green square */
.jr-stop[data-kind="project"] .jr-dot{border-radius:5px}
.jr-stop[data-kind="project"].is-done .jr-dot{background:var(--green-dim)}
/* practice interview: an amber diamond (cyan for LATENT) */
.jr-stop[data-kind="interview"] .jr-dot{--d:18px;border-radius:3px;transform:rotate(45deg)}
.jr-stop[data-kind="interview"].is-done .jr-dot{background:var(--amber-dim)}
/* new season: a flag on a pole inside a ring */
.jr-stop[data-kind="season"] .jr-dot{border-width:1.5px}
.jr-stop[data-kind="season"] .jr-dot::before{content:"";position:absolute;left:5.5px;top:3.5px;width:1.5px;height:12px;background:var(--fg)}
.jr-stop[data-kind="season"] .jr-dot::after{content:"";position:absolute;left:7px;top:3.5px;width:7px;height:5.5px;background:var(--fg);clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.jr-stop[data-kind="season"].is-done .jr-dot{background:var(--hair-2)}

/* the one-line plain-words explanation a tap opens, inside the stop or as its own row */
.jr-explain{display:block;margin:4px 10px 6px;padding-left:10px;border-left:1px solid var(--line);font-size:var(--t-sm);line-height:1.5;color:var(--muted);max-width:60ch}
.jr-path > li.jr-explain{margin:0;padding:0 10px 8px calc(var(--jr-x) + 20px);border-left:0}

/* "and N more stops" closes the path */
.jr-more{font-size:var(--t-sm);line-height:1.5;color:var(--muted)}
.jr-path > li.jr-more{padding-top:12px;padding-bottom:12px;padding-left:calc(var(--jr-x) + 10px)}
.jr-path > li.jr-more:last-child::before{height:50%}
.jr-more::after{content:"";position:absolute;z-index:1;left:calc(var(--jr-line) + 1px - 5px);top:calc(50% - 5px);width:10px;height:10px;box-sizing:border-box;border:1.5px dashed var(--faint);border-radius:50%;background:var(--bg-deep)}
.jr-more a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.jr-more a:hover{color:var(--fg)}

/* you are here: a card on the line with a ring dot, carrying the only big Continue button */
.jr-path > li.jr-marker{z-index:2;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:10px 0 10px var(--jr-x);padding:18px;border:1px solid rgba(226,162,60,.45);border-radius:14px;background:var(--surface)}
.jr-path > li.jr-marker::before{left:calc(var(--jr-line) - var(--jr-x) - 1px);top:-11px;bottom:-11px}
.jr-path > li.jr-marker:first-child::before{top:26px}
.jr-path > li.jr-marker:last-child::before{bottom:auto;height:37px}
.jr-path > li.jr-marker:only-child::before{display:none}
.jr-marker::after{content:"";position:absolute;z-index:1;left:calc(var(--jr-line) - var(--jr-x) - 9px);top:17px;width:18px;height:18px;box-sizing:border-box;border:4px solid var(--bg-deep);border-radius:50%;background:var(--amber);outline:1.5px solid rgba(226,162,60,.6);outline-offset:0}
.jr-here{font-family:var(--f-mono);font-size:var(--t-2xs);line-height:1.6;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.jr-next{font-family:var(--f-story);font-size:var(--t-xl);line-height:1.3;color:var(--fg);max-width:40ch}
.jr-next em{font-style:italic;color:var(--amber)}
.jr-marker .btn-continue{width:100%}
.jr-marker > a,.jr-marker > .btn-link{justify-self:start}
.jr-tonight{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:var(--t-sm);line-height:1.5;color:var(--muted)}
.jr-tonight li{display:flex;gap:8px;align-items:baseline;min-width:0}
.jr-tonight li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;border:1px solid var(--faint);transform:translateY(-1px)}
.jr-tonight li.is-done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.jr-tonight li.is-done::before{background:var(--green);border-color:var(--green)}
/* the marker slides down from the stop it left (JS may set --jr-from to the measured distance) */
.jr-marker.is-arriving{animation:dl-arrive .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes dl-arrive{from{transform:translateY(var(--jr-from,-64px))}to{transform:none}}

/* Continue: the big amber filled button (like .btn-start, but never pinned by the Tonight phone rule) */
.btn-continue{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:54px;padding:14px 26px;border:0;border-radius:12px;background:var(--amber);color:var(--on-accent);font-family:var(--f-ui);font-weight:600;font-size:var(--t-body);line-height:1.2;text-align:center;text-decoration:none;white-space:nowrap;cursor:pointer}
.btn-continue:hover:not(:disabled){color:var(--on-accent);text-decoration:none;filter:brightness(1.08)}
.btn-continue:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.btn-continue:disabled{background:none;border:1px dashed var(--line);color:var(--faint);font-weight:500;cursor:not-allowed;filter:none}
.btn-continue span{line-height:1}
/* the sticky Continue bar, shown by the JS while the marker is off screen: bottom right on desktop */
.continue-bar{position:fixed;z-index:33;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.continue-bar .btn-continue{min-height:50px;padding:12px 22px}

/* ---------- Memory checks (v3.0.0) ---------- */
.mc-explain{font-size:var(--t-sm);line-height:1.5;color:var(--muted);max-width:62ch}

/* ---------- Lesson player: step bar, step heading, one part at a time, fixed Back/Next (v3.0.0) ---------- */
.step-bar{margin-top:16px;min-width:0}
.step-track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.step-fill{display:block;width:0;height:100%;border-radius:2px;background:var(--amber);transition:width .3s ease}
.step-label{margin-top:8px;font-family:var(--f-mono);font-size:var(--t-xs);line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
/* D1: the step bar is a control that opens the contents sheet: div.step-bar[role=button] > .step-track + p.step-label + span.step-caret */
button.step-bar,.step-bar[role="button"]{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;width:calc(100% + 20px);padding:8px 10px 6px;margin-inline:-10px;border:1px solid transparent;border-radius:10px;background:none;text-align:left;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;transition:border-color .15s}
:is(button.step-bar,.step-bar[role="button"]) > .step-track{grid-column:1 / -1}
button.step-bar:hover,.step-bar[role="button"]:hover,.step-bar[aria-expanded="true"]{border-color:var(--line)}
button.step-bar:focus-visible,.step-bar[role="button"]:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-color:var(--line)}
:where(.course-lt) .step-bar[role="button"]:focus-visible{outline-color:var(--cyan)}
button.step-bar .step-label,.step-bar[role="button"] .step-label{color:var(--fg)}
.step-caret{margin-top:8px;font-size:var(--t-sm);line-height:1;color:var(--muted);transition:transform .15s}
.step-bar[role="button"]:hover .step-caret{color:var(--fg)}
.step-bar[aria-expanded="true"] .step-caret{transform:rotate(180deg)}
.step-head{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin:26px 0 24px;min-width:0}
.step-title{font-family:var(--f-story);font-weight:400;font-size:var(--t-2xl);line-height:1.12;letter-spacing:-.015em;color:var(--fg)}
.step-title:focus{outline:none}
.step-what{font-size:var(--t-ui);line-height:1.6;color:var(--muted);max-width:62ch}
/* the player hides every part but the active one; the active one fades in on each step change */
[data-part][hidden]{display:none!important}
[data-part].is-active{animation:dl-step-in .15s ease both}
@keyframes dl-step-in{from{opacity:0}to{opacity:1}}
/* Back and Next: fixed to the bottom at every width, centred on the 820px column, clear of the home indicator */
.step-nav{position:fixed;z-index:34;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px max(var(--gut-r),calc((100% - 820px) / 2)) calc(12px + env(safe-area-inset-bottom,0px)) max(var(--gut-l),calc((100% - 820px) / 2));background:var(--bg-deep);border-top:1px solid var(--hair)}
.step-back{flex:none;min-height:50px;padding:0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.2;color:var(--fg);white-space:nowrap;cursor:pointer;transition:border-color .15s}
.step-back:hover:not(:disabled){border-color:var(--muted)}
.step-back:disabled{opacity:.4;cursor:default}
.step-next{flex:1 1 auto;min-width:0;min-height:50px;padding:0 16px;border-radius:10px;font-size:var(--t-ui);overflow:hidden;text-overflow:ellipsis}
.step-next:disabled{background:none;border:1px dashed var(--line);color:var(--faint);font-weight:500}
/* nothing hides under the Back/Next bar; Words sits just above it */
body.lesson #view,#view:has(.step-nav){padding-bottom:calc(var(--stepnav-h) + 24px + env(safe-area-inset-bottom,0px))}
body.lesson .words-pill{bottom:calc(var(--stepnav-h) + 14px + env(safe-area-inset-bottom,0px))}
body.lesson .words-pop{bottom:calc(var(--stepnav-h) + 68px + env(safe-area-inset-bottom,0px))}

/* ---------- Weekend project and practice interview checklists (v3.0.0) ---------- */
.wp-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:66ch;counter-reset:wp}
.wp-steps > li{counter-increment:wp;position:relative;min-width:0;padding:14px 14px 14px 56px;border:1px solid var(--hair-2);border-radius:var(--r-lg);background:var(--surface);font-size:var(--t-ui);line-height:1.5;color:var(--fg)}
.wp-steps > li::before{content:counter(wp);position:absolute;left:14px;top:12px;width:28px;height:28px;display:grid;place-items:center;box-sizing:border-box;border:1.5px solid var(--line);border-radius:7px;background:var(--bg-deep);font-size:var(--t-xs);font-weight:600;line-height:1;color:var(--accent,var(--amber))}
.wp-steps > li > :is(p,div,pre,ul,ol,details,textarea){margin-top:8px}
.wp-steps > li > :first-child{margin-top:0}
.wp-steps > li.is-done{border-color:rgba(116,194,142,.35)}
.wp-steps > li.is-done::before{content:"";border-color:var(--green);background:var(--green)}
.wp-steps > li.is-done::after{content:"";position:absolute;left:25px;top:18px;width:6px;height:12px;box-sizing:border-box;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}

/* ---------- Journey map (route journey, v3.0.0): the same path, every lesson as a small dot row ---------- */
.jr-map .jr-stop:not(.is-landmark){--d:10px;--jr-dot-c:17px}
.jr-map .jr-path > li.jr-stop:not(.is-landmark){padding-top:1px;padding-bottom:1px}
.jr-map .jr-stop:not(.is-landmark) > .jr-body{padding-top:4px;padding-bottom:4px}
.jr-map .jr-stop:not(.is-landmark) .jr-title{font-size:var(--t-ui)}
.jr-map .jr-stop:not(.is-landmark) .jr-sub{display:inline;margin-left:8px;font-size:var(--t-xs);color:var(--muted)}
.jr-map .jr-stop.is-done:not(.is-landmark) .jr-dot::after{display:none}
.jr-map .board-switch-inline{margin-bottom:18px}
.jr-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 20px;font-size:var(--t-sm);line-height:1.5;color:var(--muted)}
.jr-legend > *{display:inline-flex;align-items:baseline;gap:8px;min-width:0;max-width:100%;white-space:normal;cursor:default}
.jr-legend .jr-dot{position:relative;left:auto;top:auto;flex:none}

@media (max-width: 699px){
  .journey{padding-top:20px;padding-bottom:96px}
  .jr-head{margin-bottom:16px}
  .jr-path{--jr-x:44px;--jr-line:15px}
  .jr-path > li.jr-marker{padding:14px}
  .btn-continue{display:flex;width:100%}
  /* phones: the Continue bar is a full-width bar fixed to the bottom */
  .continue-bar{left:0;right:0;bottom:0;padding:10px calc(16px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));background:var(--bg-deep);border-top:1px solid var(--hair)}
  .step-head{margin:20px 0 18px}
  .step-back{padding:0 14px}
  /* phones: Words shows in a lesson (the old bottom bar that carried it is gone), above Back/Next */
  body.lesson .words-pill{display:inline-flex;right:calc(16px + env(safe-area-inset-right,0px));padding:7px 14px}
  body.lesson .words-pop{bottom:calc(var(--stepnav-h) + 60px + env(safe-area-inset-bottom,0px))}
  .wp-steps > li{padding:12px 12px 12px 50px}
  .wp-steps > li::before{left:12px;top:11px}
  .wp-steps > li.is-done::after{left:23px;top:17px}
}

/* ---------- LATENT accent for the console parts (v2.0.0, same :where() pattern as the block above) ---------- */
:where(.course-lt) .q-code{color:var(--cyan)}
:where(.course-lt) .btn-start{background:var(--cyan);box-shadow:none}
:where(.course-lt) .hero em{color:var(--cyan)}
:where(.course-lt) .clock{color:var(--cyan);text-shadow:none}
:where(.course-lt) .words-pill{border-color:rgba(95,179,201,.55);box-shadow:0 0 0 4px rgba(95,179,201,.08),0 10px 30px rgba(0,0,0,.45)}
:where(.course-lt) .words-pill:hover,:where(.course-lt) .words-pill[aria-expanded="true"]{border-color:var(--cyan)}
:where(.course-lt) .words-pill b,:where(.course-lt) .cbb-words b,:where(.course-lt) .wp-head span,:where(.course-lt) .wp-open{color:var(--cyan)}
:where(.course-lt) .cbb-next{background:var(--cyan);box-shadow:0 0 0 1px rgba(95,179,201,.45),0 10px 30px rgba(95,179,201,.16)}
:where(.course-lt) .flair{color:var(--cyan)}
:where(.course-lt) .reply-box{background:var(--surface)}
:where(.course-lt) .iv-room{background:var(--surface)}
:where(.course-lt) .card-panel{border-color:rgba(95,179,201,.4);background:var(--surface)}
:where(.course-lt) .boot-caret{background:var(--cyan);box-shadow:0 0 10px rgba(95,179,201,.45)}
:where(.course-lt) .sim-clock{text-shadow:none}
:where(.course-lt) .fs-val,:where(.course-lt) .fs-date-wrap{color:var(--cyan);border-color:var(--cyan)}
:where(.course-lt) .fs-date-wrap:has(.fs-date:focus-visible){outline-color:var(--cyan)}
:where(.course-lt) .fs-chips input:checked + label{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
:where(.course-lt) .fs-chips input:focus-visible + label,:where(.course-lt) .fs-plans input:focus-visible + label{outline-color:var(--cyan)}
:where(.course-lt) .fs-plan input:checked + label{border-color:var(--cyan);background:var(--cyan-dim)}
:where(.course-lt) .fs-plan input:checked + label .fs-plan-name{color:var(--cyan)}
/* v3.0.0: the journey and the lesson player in LATENT views (these come after the base rules they tie with) */
:where(.course-lt) .btn-continue{background:var(--cyan)}
:where(.course-lt) .step-fill{background:var(--cyan)}
:where(.course-lt) .jr-stop[data-kind="lesson"],:where(.course-lt) .jr-stop[data-kind="interview"]{--kc:var(--cyan)}
:where(.course-lt) .jr-path > li::before{background:rgba(95,179,201,.3)}
:where(.course-lt) .jr-fold::after{background:rgba(95,179,201,.55)}
:where(.course-lt) .jr-path > li.jr-marker{border-color:rgba(95,179,201,.45)}
:where(.course-lt) .jr-marker::after{background:var(--cyan);outline-color:rgba(95,179,201,.6)}
:where(.course-lt) .jr-here,:where(.course-lt) .jr-next em{color:var(--cyan)}
.course-group[data-course="lt"] .season-block:not(.solved) .s-prog-fill{background:var(--cyan);box-shadow:0 0 8px rgba(95,179,201,.45)}

/* ---------- Lesson rows: the story headline, the tech topics, the meta line (v3.1.0, contract v3.0.0 B) ---------- */
/* <div class="ls"><p class="ls-hook">...</p><p class="ls-topic">HTTPS · TLS</p><p class="ls-meta"><span class="q-code">S1·05</span> · The Padlock · 12 min</p></div>
   used by journey stops, Seasons rows, the tonight list and the All lessons list */
.ls{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}
.ls-hook{font-family:var(--f-story);font-size:var(--t-lg);font-weight:400;line-height:1.3;letter-spacing:-.005em;color:var(--fg);max-width:60ch;text-wrap:pretty}
/* the headline is a.ls-link when the lesson can be opened (as the .ls-hook itself or inside it) */
.ls-hook a,a.ls-link{color:inherit;text-decoration:none}
a.ls-link:not(.ls-hook){display:block}   /* when the link is the .ls-hook itself it keeps the phone line clamp */
.ls-hook a:hover,a.ls-link:hover{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ls-topic{font-family:var(--f-ui);font-size:var(--t-sm);font-weight:500;line-height:1.45;color:var(--amber);color:color-mix(in srgb,var(--amber) 85%,transparent)}
[data-course="lt"] .ls-topic,.ls[data-course="lt"] .ls-topic,:where(.course-lt) .ls-topic{color:var(--cyan);color:color-mix(in srgb,var(--cyan) 85%,transparent)}
.ls-meta{font-family:var(--f-mono);font-size:var(--t-xs);line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.ls-meta .q-code{font-size:inherit}
/* step 1's topic line in the lesson's step head: p.ls-topic.step-topic */
.step-topic{margin-top:2px;max-width:62ch}
/* a LATENT lesson on the journey: its dot follows the course of its .ls block */
.jr-stop[data-kind="lesson"]:has(> .jr-body > .ls[data-course="lt"]){--kc:var(--cyan)}
/* All lessons: the empty line under the search box when nothing matches */
.ls-empty{margin:0 0 22px;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r-lg);font-size:var(--t-ui);line-height:1.5;color:var(--muted);max-width:66ch}
/* rows on All lessons and the journey hide with the hidden attribute while filtering; the global [hidden] rule
   (display:none!important) already outranks every display rule on .season-item, .season-block and .course-group */
.season-item[hidden],.season-block[hidden],.course-group[hidden],.jr-stop[hidden]{display:none!important}
/* in context: compact on the Journey map and in the marker's tonight list, flexible inside flex rows */
.jr-map .jr-stop:not(.is-landmark) .ls{gap:1px}
.jr-map .jr-stop:not(.is-landmark) .ls-hook{font-size:var(--t-ui)}
.jr-map .jr-stop:not(.is-landmark) .ls-topic{font-size:var(--t-xs)}
.jr-stop.is-done .ls-hook{font-size:var(--t-body)}
.jr-tonight li > .ls{flex:1 1 auto;gap:1px}
.jr-tonight .ls-hook{font-size:var(--t-sm);line-height:1.4}
.jr-tonight .ls-topic{font-size:var(--t-xs)}
.season-item > .ls,.q-main > .ls{flex:1 1 0;min-width:0}

/* ---------- The Reading panel: layout, theme, text size (v3.1.0, contract C) ---------- */
/* a popover under the case bar's Reading button on desktop, a bottom sheet under 700px; flat, a border and no shadow.
   Markup (a sibling right after .case-bar): .rd-panel > .rd-head (.rd-title + .rd-x), then .rd-group > .rd-k +
   .rd-opts > button.rd-opt[aria-pressed]; the text-size group has button.rd-step (A-, A+; may be disabled) and .rd-size */
.rd-panel{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + var(--casebar-h) + 6px);right:max(var(--gut-r),calc((100% - 820px) / 2));width:360px;max-width:calc(100% - 32px);max-height:calc(100vh - var(--casebar-h) - 24px);max-height:calc(100dvh - var(--casebar-h) - 24px);overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px 18px;background:var(--pop-bg);border:1px solid var(--line);border-radius:14px;color:var(--fg);animation:dl-pop-in .14s ease both}
body:not(.lesson) .rd-panel{top:calc(env(safe-area-inset-top,0px) + var(--topbar-h) + var(--casebar-h) + 7px)}
.rd-head{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.rd-title{font-family:var(--f-story);font-size:var(--t-lg);font-weight:400;line-height:1.2;color:var(--fg)}
.rd-x,.toc-x{flex:none;display:inline-grid;place-items:center;min-width:36px;min-height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:none;font-size:var(--t-ui);line-height:1;color:var(--muted);cursor:pointer}
.rd-x:hover,.toc-x:hover{border-color:var(--muted);color:var(--fg)}
/* a group: its label on its own line, then the options (or A-, the size name, A+) in one row */
.rd-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0;margin:0;padding:0;border:0}
.rd-group + .rd-group{padding-top:14px;border-top:1px solid var(--hair)}
.rd-k{flex:1 1 100%;padding:0;font-size:var(--t-sm);font-weight:500;line-height:1.4;color:var(--muted)}
.rd-opts{flex:1 1 100%;display:flex;align-items:center;gap:4px;min-width:0;padding:3px;border:1px solid var(--line);border-radius:10px}
.rd-opt,.rd-step{min-width:0;min-height:40px;padding:6px 10px;border:1px solid transparent;border-radius:8px;background:none;font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.25;color:var(--muted);text-align:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.rd-opt{flex:1 1 0}
.rd-step{flex:none;min-width:52px;border-color:var(--line);background:var(--surface-2);font-weight:500;color:var(--fg)}
.rd-opt:hover:not(:disabled),.rd-step:hover:not(:disabled){color:var(--fg);background:var(--surface-2);border-color:var(--muted)}
.rd-opt:hover:not(:disabled):not([aria-pressed="true"]){border-color:transparent}
.rd-opt:disabled,.rd-step:disabled{opacity:.4;cursor:default}
.rd-size{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;min-width:0;min-height:40px;font-size:var(--t-sm);font-weight:500;color:var(--fg);text-align:center}
.rd-opt[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-dim);color:var(--amber);font-weight:500}
:where(.course-lt) .rd-opt[aria-pressed="true"],body:has(#view.course-lt) .rd-opt[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-dim);color:var(--cyan)}

/* ---------- Whole lesson layout: body[data-layout="whole"] (v3.1.0, contract C1) ---------- */
/* Every part shows in one scrolling page. The JS sets data-layout="whole" on body and #view ("step" otherwise),
   removes the hidden attribute from every unlocked part (a locked part2 stays hidden, with p.step-locked in its place),
   puts header.step-head.step-head-inline[data-step] before each part, and hides the top .step-head and .step-nav.
   The CSS removes the rest of the step player's chrome and makes the step bar a sticky mini contents bar. */
:root{--minibar-h:52px}
body[data-layout="whole"] [data-part]{animation:none}
body[data-layout="whole"] .step-nav{display:none!important}
body[data-layout="whole"].lesson #view,body[data-layout="whole"] #view:has(.step-nav){padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
body[data-layout="whole"].lesson .words-pill{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body[data-layout="whole"].lesson .words-pop{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
/* step heads: the inline heads (one before each part) show only in this layout; the player's single head steps aside */
.step-head.step-head-inline{margin:52px 0 22px;padding-top:28px;border-top:1px solid var(--hair)}
.step-head.step-head-inline .step-title{font-size:var(--t-xl)}
body:not([data-layout="whole"]) #view:not([data-layout="whole"]) .step-head-inline{display:none}
body[data-layout="whole"] #view:has(.step-head-inline) .step-head:not(.step-head-inline){display:none}
/* the sticky mini contents bar: the step bar pinned under the case bar, showing the section in view */
body[data-layout="whole"] .step-bar{position:sticky;z-index:28;top:calc(env(safe-area-inset-top,0px) + var(--casebar-h));margin-top:0;padding-top:8px;padding-bottom:8px;border:0;border-bottom:1px solid var(--hair);border-radius:0;background:var(--bg-deep)}
body[data-layout="whole"]:not(.lesson) .step-bar{top:calc(env(safe-area-inset-top,0px) + var(--topbar-h) + var(--casebar-h) + 1px)}
body[data-layout="whole"] .step-bar .step-label,body[data-layout="whole"] .step-bar .step-caret{margin-top:6px}
/* parts and heads land below the sticky case bar and the sticky step bar when jumped to */
body[data-layout="whole"] [data-part],.step-head-inline{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--casebar-h) + var(--minibar-h) + 12px)}
body[data-layout="whole"]:not(.lesson) [data-part],body:not(.lesson) .step-head-inline{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--topbar-h) + var(--casebar-h) + var(--minibar-h) + 13px)}
/* a locked step in the whole page: "Pick your advice above to read what happened next." */
.step-locked{margin:8px 0;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r-lg);font-size:var(--t-ui);line-height:1.55;color:var(--muted);max-width:66ch}

/* ---------- The contents sheet: jump to any step (v3.1.0, contract D1) ---------- */
/* Markup (siblings appended to #view): .toc-scrim + .toc-sheet > .toc-head (.toc-title + .toc-x), then
   ol.toc-list > li.toc-item > button.toc-row[data-state=done|current|locked|todo] > .toc-mark + .toc-text
   (.toc-name, .toc-what, .toc-why). A right-side panel on desktop, a sheet that slides up from the bottom on phones. */
.toc-scrim{position:fixed;inset:0;z-index:69;background:var(--scrim-strong);animation:dl-fade-in .15s ease both}
.toc-sheet{position:fixed;z-index:70;top:0;right:0;bottom:0;width:min(440px,100%);overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 14px;background:var(--pop-bg);border:0;border-left:1px solid var(--line);color:var(--fg);animation:dl-side-in .18s ease both}
.toc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 6px 10px;min-width:0}
.toc-title{font-family:var(--f-story);font-size:var(--t-xl);font-weight:400;line-height:1.2;color:var(--fg)}
.toc-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.toc-item{min-width:0}
.toc-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;width:100%;min-width:0;min-height:52px;padding:10px;border:1px solid transparent;border-radius:10px;background:none;color:var(--fg);text-align:left;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.toc-row:hover:not(:disabled){background:var(--surface-2);text-decoration:none}
.toc-mark{position:relative;display:grid;place-items:center;width:26px;height:26px;margin-top:1px;box-sizing:border-box;border:1.5px solid var(--line);border-radius:50%;font-family:var(--f-mono);font-size:var(--t-2xs);font-weight:500;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.toc-text{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;min-width:0}
.toc-name{font-family:var(--f-story);font-size:var(--t-lg);line-height:1.25;color:var(--fg)}
.toc-what{font-size:var(--t-sm);line-height:1.5;color:var(--muted);max-width:60ch}
.toc-why{font-size:var(--t-xs);font-weight:500;line-height:1.5;color:var(--muted)}
/* done: a filled green ring with a CSS tick (any glyph the JS puts in the mark is hidden behind it) */
.toc-row[data-state="done"] .toc-mark{border-color:var(--green);background:var(--green);color:transparent}
.toc-row[data-state="done"] .toc-mark::after{content:"";position:absolute;left:calc(50% - 2.5px);top:calc(50% - 6px);width:5px;height:9px;box-sizing:border-box;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
/* current: an amber ring on a tinted row (cyan in LATENT) */
.toc-row[data-state="current"]{border-color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:var(--amber-dim)}
.toc-row[data-state="current"] .toc-mark{border-color:var(--amber);color:var(--amber)}
:where(.course-lt) .toc-row[data-state="current"],body:has(#view.course-lt) .toc-row[data-state="current"]{border-color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent);background:var(--cyan-dim)}
:where(.course-lt) .toc-row[data-state="current"] .toc-mark,body:has(#view.course-lt) .toc-row[data-state="current"] .toc-mark{border-color:var(--cyan);color:var(--cyan)}
/* locked: dimmed, with its reason (.toc-why, "pick your advice first") kept at full contrast */
.toc-row[data-state="locked"],.toc-row:disabled{cursor:not-allowed}
.toc-row[data-state="locked"]:hover{background:none}
.toc-row[data-state="locked"] .toc-mark{border-style:dashed}
.toc-row[data-state="locked"] .toc-mark,.toc-row[data-state="locked"] .toc-name,.toc-row[data-state="locked"] .toc-what{opacity:.55}

/* ---------- All lessons: the search box (v3.1.0, contract D2) ---------- */
/* .ls-search is the input itself or a wrapper around it; large, full width, 16px+ so phones do not zoom */
.ls-search{display:block;width:100%;max-width:100%;min-width:0;margin:0 0 22px}
input.ls-search,.ls-search input{display:block;width:100%;max-width:100%;min-height:52px;margin:0;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--f-ui);font-size:var(--t-body);line-height:1.4;color:var(--fg);-webkit-appearance:none;appearance:none}
input.ls-search{margin-bottom:22px}   /* v3.1.1: the rule above resets margin for the wrapper case */

input.ls-search:focus-visible,.ls-search input:focus-visible{border-color:var(--amber);outline:2px solid var(--amber);outline-offset:1px}

/* ---------- The journey: "Open this lesson" / "Look at it" under a stop's explain line (v3.1.0, contract D3) ---------- */
.jr-open{display:inline-flex;align-items:center;gap:6px;min-height:36px;margin-top:4px;font-size:var(--t-sm);font-weight:500;line-height:1.3;color:var(--kc,var(--amber));text-decoration:underline;text-decoration-color:currentColor;text-decoration-thickness:1px;text-underline-offset:3px}

/* ---------- phones: bottom sheets, the headline clamp, 44px hit areas (v3.1.0, contract A4, B, C, D) ---------- */

  /* Journey map rows: the whole row is the tap target, so it grows to 44px and its dot stays centred */

  /* list rows: the title link covers its whole row, so the tap target is the row */
  .q-row,.season-item{position:relative}

}

/* ---------- Paper: a warm light reading theme, site wide (v3.1.0, contract C2) ---------- */
/* A token override on html or body (the JS sets data-theme="paper"; "night" or no attribute is the dark theme).
   Everything reads the tokens, including diagrams, the simulator, the top bar and the progress line; the rules after
   the token block only re-mix the night theme's fixed amber, cyan, green and red tints and switch glows off. */
:root[data-theme="paper"],html:has(> body[data-theme="paper"]),body[data-theme="paper"]{
  color-scheme:light;
  --bg:#f4efe3; --bg-deep:#f4efe3; --bg-glass:rgba(244,239,227,.92);
  --surface:#faf7ef; --surface-2:#ebe4d4; --line:#c9bfa9;
  --fg:#26221b; --story-fg:#2b261e; --muted:#5f5a50; --faint:#7d776b;
  --amber:#9a5b00; --amber-dim:rgba(154,91,0,.1);
  --red:#b3261e; --red-dim:rgba(179,38,30,.08);
  --green:#2e7d4f; --green-dim:rgba(46,125,79,.1);
  --cyan:#1d6a80; --cyan-dim:rgba(29,106,128,.1);
  --paper:#ece2c4; --paper-edge:#c9bc96; --ink:#2a2316; --cork:#d8cbae; --paper-dim:rgba(201,188,150,.35);
  --hair:rgba(0,0,0,.08); --hair-2:rgba(0,0,0,.12);
  --amber-glow:transparent;
  --on-accent:#fffaf0;
  --topbar-bg:rgba(244,239,227,.94);
  --bar-bg:rgba(244,239,227,.97); --bar-line:rgba(0,0,0,.12);
  --bg-fade:rgba(244,239,227,0);
  --pop-bg:#fbf8f1; --pop-shadow:none;
  --scrim:rgba(38,34,27,.12); --scrim-strong:rgba(38,34,27,.38);
  --ok-bg:#dcebdf;
  --dash:rgba(0,0,0,.28);
  --note-shadow:none;
}
[data-theme="paper"] ::selection{background:rgba(154,91,0,.2);color:var(--fg)}
/* light form controls and date picker */
[data-theme="paper"] input,[data-theme="paper"] select,[data-theme="paper"] textarea{color-scheme:light}
[data-theme="paper"] input[type="date"]::-webkit-calendar-picker-indicator{filter:none;opacity:.7}
/* popovers sit on --pop-bg, which is as light as --surface on paper: hovers use the deeper surface */
[data-theme="paper"] .menu-link:hover,[data-theme="paper"] .menu-link:focus-visible{background:var(--surface-2)}
/* flat: every glow and drop shadow off (!important so it also beats the LATENT glow rules) */
[data-theme="paper"] :is(.progress-fill,.live-dot,.boot-caret,.btn-primary,.ss-status i,.s-prog-fill,.words-pill,.cbb-next,.rules-note,.menu-panel,.words-pop),
[data-theme="paper"] .nb-track .seg-dl,[data-theme="paper"] .season-block.here > .tl-dot,[data-theme="paper"] .season-block.here > .tl-dot::after{box-shadow:none!important}
/* the reading-progress line: the paper amber (the LATENT cyan rule still wins in LATENT views) */
[data-theme="paper"] .progress-line[data-mode="read"] .progress-fill{background:var(--amber)}
/* the typewritten note: one subtle 1px border in place of its shadow */
[data-theme="paper"] .rules-note{border:1px solid var(--paper-edge)}
/* accent tints re-mixed from the paper accent (--accent is cyan inside LATENT views, so these stay course coloured) */
[data-theme="paper"] .btn-primary,[data-theme="paper"] .words-pill{border-color:color-mix(in srgb,var(--accent,var(--amber)) 55%,transparent)}
[data-theme="paper"] .btn-primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent,var(--amber)) 16%,transparent)}
[data-theme="paper"] .reply-box,[data-theme="paper"] .card-panel,[data-theme="paper"] .iv-room,[data-theme="paper"] .settings-group.sync-card{border-color:color-mix(in srgb,var(--accent,var(--amber)) 45%,transparent)}
[data-theme="paper"] .callout.due,[data-theme="paper"] .season-block.here,[data-theme="paper"] .rule.fading{border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
[data-theme="paper"] .season-block.solved,[data-theme="paper"] .rule.known,[data-theme="paper"] .close-box.done,[data-theme="paper"] .build-done{border-color:color-mix(in srgb,var(--green) 50%,transparent)}
[data-theme="paper"] .wp-steps > li.is-done{border-color:color-mix(in srgb,var(--green) 45%,transparent)}
[data-theme="paper"] .settings-group.danger,[data-theme="paper"] .confirm,[data-theme="paper"] .error-panel,[data-theme="paper"] .inline-error{border-color:color-mix(in srgb,var(--red) 45%,transparent)}
[data-theme="paper"] .chip-course{border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
[data-theme="paper"] .chip-course[data-course="lt"]{border-color:color-mix(in srgb,var(--cyan) 50%,transparent)}
[data-theme="paper"] .next-case{border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:color-mix(in srgb,var(--amber) 6%,transparent)}
[data-theme="paper"] .next-case[data-course="lt"]{border-color:color-mix(in srgb,var(--cyan) 40%,transparent);background:color-mix(in srgb,var(--cyan) 6%,transparent)}
[data-theme="paper"] .next-case[data-course="lt"] .btn-primary{border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
[data-theme="paper"] .season-item.is-next{background:color-mix(in srgb,var(--amber) 9%,transparent)}
[data-theme="paper"] .course-group[data-course="lt"] .season-item.is-next{background:color-mix(in srgb,var(--cyan) 9%,transparent)}
[data-theme="paper"] .nb-track .seg-lt,[data-theme="paper"] .nb-key.seg-lt::before{background:color-mix(in srgb,var(--cyan) 45%,transparent)}
[data-theme="paper"] .nb-track .seg-build,[data-theme="paper"] .nb-key.seg-build::before{background:color-mix(in srgb,var(--green) 45%,transparent)}
[data-theme="paper"] .nb-track .seg-cold,[data-theme="paper"] .nb-key.seg-cold::before{background:rgba(0,0,0,.16)}
/* the journey: the past line, the season folds and the marker card */
[data-theme="paper"] .jr-path > li::before{background:color-mix(in srgb,var(--accent,var(--amber)) 40%,transparent)}
[data-theme="paper"] .jr-fold::after{background:color-mix(in srgb,var(--accent,var(--amber)) 60%,transparent)}
[data-theme="paper"] .jr-path > li.jr-marker{border-color:color-mix(in srgb,var(--accent,var(--amber)) 50%,transparent)}
[data-theme="paper"] .jr-marker::after{outline-color:color-mix(in srgb,var(--accent,var(--amber)) 60%,transparent)}
/* diagrams: the muted tone's grey tint, re-mixed for a light ground (everything else reads the tokens) */
[data-theme="paper"] .tone-muted{--tone-dim:rgba(0,0,0,.06)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

  .clock-colon,.live-dot,.boot-caret{animation:none!important;opacity:1}

  .jr-marker,.jr-marker.is-arriving,[data-part].is-active,.step-head,.step-fill,.btn-continue,.step-back,.continue-bar{animation:none!important;transition:none!important}

  .rd-panel,.toc-sheet,.toc-scrim,.toc-row,.rd-opt,.rd-step,button.step-bar,.step-bar[role="button"],.step-caret,.jr-stop.is-done > .jr-body{animation:none!important;transition:none!important}
  .rd-panel,.toc-sheet{transform:none!important;opacity:1!important}
  html{scroll-behavior:auto!important}
}

<script src="engine/diagram.js?v=1.0.0"></script>

<script src="engine/ui.js?v=3.1.0"></script>
<script>
(function () {
  "use strict";
  function fail(err) {
    var view = document.getElementById("view");
    if (!view) return;
    while (view.firstChild) view.removeChild(view.firstChild);
    var sec = document.createElement("section");
    sec.className = "wrap";
    var panel = document.createElement("div");
    panel.className = "error-panel";
    panel.setAttribute("role", "alert");
    var eb = document.createElement("p");
    eb.className = "eyebrow";
    eb.textContent = "Couldn't clock in";
    var h = document.createElement("h1");
    h.textContent = "The night shift didn't start.";
    var p = document.createElement("p");
    p.textContent = "Reload the page to try again. Nothing you saved has been changed.";
    var pre = document.createElement("pre");
    pre.className = "err-detail";
    pre.textContent = (err && err.message) ? String(err.message) : String(err || "Unknown error");
    panel.appendChild(eb); panel.appendChild(h); panel.appendChild(p); panel.appendChild(pre);
    sec.appendChild(panel);
    view.appendChild(sec);
  }
  var DL = window.DL;
  if (!DL || !DL.ui || typeof DL.ui.boot !== "function") {
    fail(new Error("The app's engine files didn't load (engine/core.js, engine/diagram.js, engine/sim.js, engine/ui.js)."));
    return;
  }
  try {
    var started = DL.ui.boot();
    if (started && typeof started.then === "function") {
      started.then(null, function (err) {
        if (DL.ui && typeof DL.ui.showError === "function") DL.ui.showError(err); else fail(err);
      });
    }
  } catch (err) {
    if (DL.ui && typeof DL.ui.showError === "function") DL.ui.showError(err); else fail(err);
  }
})();
</script>
