  v3.0.0 (2026-10-18) the journey (approved mockup guided-flow-v1.0.0.html) for engine/ui-v3.0.0.js: home is a vertical
    path with a you-are-here marker and one Continue button, landmark shapes for weekend projects, practice interviews
    and new seasons, a sticky Continue bar; memory-check screen; the lesson player's step bar, step heading and fixed
    Back/Next bar replace the dot rail and focus mode (body.lesson hides the top bar); weekend-project and
    practice-interview checklists; the Journey map page.
    Removed with them: the dot rail, the Exit focus button and every body.focus rule; the case bar and part scroll
    offsets now key off body.lesson, and the post's no-card lesson look moves from body.focus to body.lesson. The
    Words pill and popover sit above the Back/Next bar and show on phones in a lesson (the phone bottom bar is unused).
  v2.1.0 (2026-10-17) fluid type scale: ten --t-* tokens with clamp() from 360px phones to 1920px monitors replace
    28 fixed sizes; nothing below 12px (diagram and sim text excepted, 11px floor); reading text (comments,
    explanations, glossary, guide, notes) at --t-body, choices and buttons at --t-ui, tiny uppercase section
    headings raised to --t-xs; font-size-only media overrides removed. Top bar fits at every width: phones use smaller top-bar text, the date hides below 900px and the
    top-bar clock below 420px (the case bar keeps its clock).
  v2.0.1 (2026-10-17) the site is 3AM Labs (3amlabs.dev): page title and wordmark read "3AM Labs"; /n/nightshift

  v2.0.0 (2026-10-17) Night console redesign (mockup redesign-c-console-v1.0.0.html) for engine/ui-v2.0.0.js: one-row
    top bar with live dot, clock and Menu overlay replacing the masthead, board switcher and tab row; full-width
    progress line; Tonight hero, night bar and queue; case focus mode with case bar, dot rail, Words popover and
    phone bottom bar; Seasons timeline with the board switcher inside the view; every other view re-tinted to the
    console tokens. Flat surfaces only: no decorative gradients, background glow or soft glows on buttons and the clock (Aman, 17 Oct); the one gradient
    left is the fade behind the phone bottom bars.
    First shift is a fill-in sentence (finish date with 3/4/6 month presets, minute pills, plan rows, a live 'it fits'
    line, the big Clock in button); Settings uses the same minute pills; number spinners hidden.
  v1.2.0 (2026-10-17) UI pass for engine/ui-v1.2.6.js: the nav row uses the same 820px column as the masthead and
    the views (was 1100px, so tabs started left of the content) and scrolls sideways in one row on small screens
    instead of wrapping; form fields align to the top so inputs keep one height when a neighbour has help text;
    collapsible season blocks (details/summary with a turning caret), a season progress bar, the course progress
    line; the Evidence empty-state panel.
  v1.1.0 (2026-10-07) CSS and masthead for engine/ui-v1.2.0.js (two courses on one forum, Build Nights;
    engine contract v1.1.0 section 9.9): the cyan and cyan-dim tokens in :root; a .course-lt rule set that remaps the
    accent usages (links, focus rings, eyebrows, chips, primary and pressed buttons, the reply box and
    verdict-ok borders, panel heads, pull quotes and side rules, the interview room, sim and diagram accents)
    from amber to cyan inside LATENT views, written as :where(.course-lt) so each override keeps the
    specificity of the rule it remaps; semantic amber (warn chips, behind pace, fading, diagram warn states)
    stays amber; the masthead board turns cyan on LATENT pages. The masthead gets id="brand-tag" on the
    tagline and an empty #board-switch container. New styles: the course chip, the board switcher (wraps

  v1.0.1 (2026-10-06) CSS only, for engine/ui-v1.1.0.js: long rulebook chips wrap (.rule-status .chip

  v1.0.0 (2026-10-04) first version: page shell (masthead, nav and view containers), design tokens,

<title>3AM Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Special+Elite&display=swap">
<style>
/* Layout: one reading column (820px) for the story and the explanation, widening to 1100px for
   sims and wide diagrams. A 16px side gutter at every width. UI and explanations in a sans (v3.1.0),
   codes, times, counts and logs in mono, the story in a book serif, notes on typewritten paper.
   Night (dark) by default; Paper (light) is a token override on [data-theme="paper"], see the Paper theme block. */
:root{
  color-scheme: dark;
  --bg:#0b0d0f; --bg-glass:rgba(11,13,15,.92); --surface:#12161a; --surface-2:#192026; --line:#28313a;
  --fg:#e8e5dc; --muted:#b3bac1; --faint:#8f98a0;   /* v3.1.0 contrast: --faint is for decoration only, never body text */
  --amber:#e2a23c; --amber-dim:rgba(226,162,60,.14);
  --red:#ef6a5f; --red-dim:rgba(239,106,95,.16);
  --green:#74c28e; --green-dim:rgba(116,194,142,.14);
  --cyan:#5fb3c9; --cyan-dim:rgba(95,179,201,.14);
  --paper:#d8ceaf; --paper-edge:#b9ad8b; --ink:#2a2316; --cork:#1f1914;
  --f-story:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;   /* v3.1.0: reading and UI */
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;                   /* v3.1.0: codes, times, counts, logs, kbd, sim */
  --f-type:"Special Elite", "Courier New", Courier, monospace;
  --r:6px;
  /* Night console additions (v2.0.0) */
  --bg-deep:#060708;
  --hair:rgba(255,255,255,.055);
  --hair-2:rgba(255,255,255,.09);
  --story-fg:#e4e0d6;
  /* theme surfaces that used to be hard-coded dark colours (v3.1.0; the Paper theme redefines each) */
  --on-accent:#1a1206;                     /* text and ticks on a filled amber, cyan or green surface */
  --topbar-bg:rgba(6,7,8,.88);
  --bar-bg:rgba(7,8,10,.96); --bar-line:rgba(255,255,255,.07);   /* the case bar's full-width band */
  --bg-fade:rgba(6,7,8,0);                 /* the transparent end of the phone bottom-bar fades */
  --pop-bg:#0f1316; --pop-shadow:0 30px 70px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.25); --scrim-strong:rgba(0,0,0,.6);
  --ok-bg:#0f1a14;                         /* the inside of a solved season dot */
  --dash:#3a444d;                          /* dashed outlines: spare minutes, Build Night cards */
  --note-shadow:0 10px 24px rgba(0,0,0,.45);
  --amber-glow:transparent;
  --paper-dim:rgba(216,206,175,.32);
  --r-lg:10px;
  --topbar-h:58px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  /* Fluid type scale (v2.1.0): grows from 360px phones to 1920px monitors, nothing below 12px */
  --t-2xs: 12px;                                         /* tiny mono labels, eyebrows, kbd, counts */
  --t-xs: clamp(12.5px, 0.74rem + 0.12vw, 13.5px);       /* meta, small mono data */
  --t-sm: clamp(13.5px, 0.8rem + 0.15vw, 14.5px);        /* secondary UI text */
  --t-ui: clamp(15px, 0.88rem + 0.2vw, 16px);            /* main UI text, buttons, choices, inputs */
  --t-body: clamp(16.5px, 0.95rem + 0.3vw, 18px);        /* reading text that is not the story: comments, explain, guide, notes */
  --t-story: clamp(18px, 1.02rem + 0.4vw, 21px);         /* the story column */
  --t-lg: clamp(19px, 1.05rem + 0.5vw, 23px);            /* row titles, small headings */
  --t-xl: clamp(22px, 1.1rem + 0.9vw, 28px);             /* section and season headings */
  --t-2xl: clamp(26px, 1.2rem + 1.5vw, 38px);            /* post titles, sub-heroes */
  --t-3xl: clamp(32px, 1.3rem + 2.6vw, 54px);            /* hero and page h1 */
}
html{background:var(--bg-deep)}
body{ background:var(--bg-deep); color:var(--fg); }

/* ---------- base ---------- */
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-ui);font-size:var(--t-ui);line-height:1.6;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:0 calc(64px + env(safe-area-inset-bottom,0px));overflow-wrap:break-word;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(226,162,60,.32);color:var(--fg)}
[hidden]{display:none!important}
a{color:var(--amber);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg text{font-family:var(--f-mono)}   /* diagram.js lays labels out for mono metrics */
kbd,pre,code,samp{font-family:var(--f-mono)}
.wrap{max-width:820px;margin-inline:auto;min-width:0}
.wide{max-width:1100px;margin-inline:auto;min-width:0}
.section{padding-block:40px 8px}
.muted{color:var(--muted)}
.small{font-size:var(--t-xs)}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main{display:block;min-width:0}

/* ---------- progress line, top bar, clock and menu (v2.0.0) ---------- */
/* the 2px line across the very top: sessions closed on most routes, reading progress on case routes */
.progress-line{position:fixed;top:0;left:0;right:0;height:2px;background:var(--hair);z-index:60;pointer-events:none}
.progress-fill{display:block;width:0;height:100%;background:var(--amber);box-shadow:0 0 10px var(--amber-glow);transition:width .3s ease}
.progress-line[data-mode="read"] .progress-fill{background:#f0b453;box-shadow:0 0 12px rgba(240,180,83,.55);transition:width .12s linear}
/* the line sits outside #view, so the LATENT tint reads the view's class through :has() */
body:has(#view.course-lt) .progress-fill{background:var(--cyan);box-shadow:0 0 10px rgba(95,179,201,.45)}

/* one-row top bar: wordmark and live dot, two links, date, clock, Menu */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding-left:var(--gut-l);padding-right:var(--gut-r);background:var(--topbar-bg);border-bottom:1px solid var(--hair);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.topbar-in{max-width:1100px;margin-inline:auto;height:var(--topbar-h);display:flex;align-items:center;gap:0 28px;min-width:0}
.wordmark{display:flex;align-items:center;gap:8px;flex:none;min-width:0;color:var(--fg);text-decoration:none}
.wordmark:hover{text-decoration:none}
.brand-mark{font-family:var(--f-story);font-style:italic;font-weight:400;font-size:var(--t-lg);line-height:1;letter-spacing:-.01em;color:var(--fg)}
.live-dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px rgba(239,106,95,.6);transform:translateY(2px);animation:dl-pulse 2.4s ease-in-out infinite}
@keyframes dl-pulse{0%,100%{opacity:1;box-shadow:0 0 8px rgba(239,106,95,.65)}50%{opacity:.45;box-shadow:0 0 2px rgba(239,106,95,.25)}}
.brand-board{margin-left:4px;font-family:var(--f-mono);font-size:var(--t-2xs);letter-spacing:.02em;color:var(--muted);white-space:nowrap;transform:translateY(1px)}
.topbar[data-course="lt"] .brand-board,body:has(#view.course-lt) .brand-board{color:var(--cyan)}
.top-links{align-self:stretch;display:flex;align-items:stretch;gap:0 28px;flex:0 1 auto;min-width:0;margin-right:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.top-links::-webkit-scrollbar{display:none}
.top-link{flex:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:var(--t-ui);color:var(--muted);text-decoration:none;box-shadow:inset 0 -1px 0 transparent}
.top-link:hover{color:var(--fg);text-decoration:none}
.top-link[aria-current="page"]{color:var(--fg);box-shadow:inset 0 -1px 0 var(--fg)}
.tab-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--on-accent);font-family:var(--f-mono);font-size:var(--t-2xs);font-weight:600;line-height:1;letter-spacing:0;text-align:center}
.top-date{flex:none;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.clock{flex:none;font-family:var(--f-mono);font-weight:500;font-size:var(--t-ui);letter-spacing:.08em;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:none}
.clock-colon{animation:dl-colon 2s steps(1) infinite}
@keyframes dl-colon{50%{opacity:.2}}
.menu-btn{flex:none;display:inline-flex;align-items:center;gap:9px;padding:6px 14px 6px 12px;border:1px solid var(--line);border-radius:999px;background:none;font-size:var(--t-sm);line-height:1.3;color:var(--fg)}
.menu-btn:hover{border-color:var(--muted)}
.menu-btn[aria-expanded="true"]{border-color:var(--amber);color:var(--amber)}
.menu-ico{position:relative;display:block;flex:none;width:12px;height:5px;border-top:1px solid currentColor}
.menu-ico::after{content:"";position:absolute;left:0;top:3px;width:8px;height:1px;background:currentColor}

/* the Menu overlay: a panel under the button on desktop, a right-hand sheet on phones */
.menu{position:fixed;inset:0;z-index:80}
.menu-scrim{position:absolute;inset:0;background:var(--scrim)}
.menu-panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + var(--topbar-h) + 6px);right:max(var(--gut-r),calc((100% - 1100px) / 2));width:360px;max-width:calc(100% - 32px);max-height:calc(100% - var(--topbar-h) - 24px);overflow-y:auto;padding:10px;background:var(--pop-bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--pop-shadow)}
.menu-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 12px;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.menu-close{font-size:var(--t-xs);letter-spacing:.04em;text-transform:none;line-height:1.4;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.menu-close:hover{color:var(--fg);border-color:var(--muted)}
.menu-links{display:grid;grid-template-columns:minmax(0,1fr)}
.menu-link{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 12px;border-radius:10px;color:var(--fg);text-decoration:none;min-width:0}
.menu-link:hover,.menu-link:focus-visible{background:var(--surface);text-decoration:none}
.menu-link[aria-current="page"] .ml-name{color:var(--amber)}
.ml-name{font-family:var(--f-story);font-size:var(--t-lg);line-height:1.25;color:var(--fg);min-width:0}
.ml-hint{flex:none;font-size:var(--t-xs);color:var(--muted);white-space:nowrap;text-align:right}
.menu-sep{height:0;border:0;border-top:1px solid var(--hair);margin:6px 12px}

/* lesson player (case pages, v3.0.0): the top bar steps aside for the case bar */
body.lesson #nav{display:none}

@media (max-width: 699px){
  :root{--topbar-h:50px}
  .topbar-in{gap:0 12px}
  .brand-board,.top-date{display:none}
  .top-links{flex:1 1 0;gap:0 14px}
  .top-link{gap:6px;font-size:var(--t-sm)}   /* phones: keeps Tonight + Cold cases + clock on one row */
  .brand-mark{font-size:var(--t-ui)}
  .clock{font-size:var(--t-sm)}
  .menu-btn{width:44px;height:44px;padding:0;gap:0;justify-content:center;border-radius:10px;font-size:0}
  .menu-scrim{background:var(--scrim-strong)}
  .top-current{display:none}   /* phones: the page heading names a menu page; its top-bar link only scrolled under Menu */
  .menu-panel{top:0;right:0;bottom:0;width:min(340px,86%);max-width:none;max-height:none;border-radius:0;border-width:0 0 0 1px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 10px}
}
@media (max-width: 899px){
  .top-date{display:none}   /* tablets: the date gives way so the Cold cases count is never clipped */
}
@media (max-width: 419px){
  .topbar .clock{display:none}   /* smallest phones: the top-bar clock gives way to the Cold cases link; the case bar keeps its clock */
}

/* ---------- loading and errors ---------- */
.boot{padding-block:96px 48px;display:grid;gap:8px}
.boot-mark{font-family:var(--f-story);font-style:italic;font-size:var(--t-2xl);letter-spacing:-.01em;color:var(--fg)}
.boot-caret{display:inline-block;width:.5em;height:.95em;margin-left:6px;background:var(--amber);box-shadow:0 0 10px var(--amber-glow);vertical-align:-2px;animation:dl-blink 1.1s step-end infinite}
.boot-sub{color:var(--muted);font-size:var(--t-xs)}
.loading{padding-block:40px;color:var(--muted);font-family:var(--f-story);font-style:italic;font-size:var(--t-lg)}
.loading-inline{color:var(--muted);font-size:var(--t-xs)}
.error-panel{margin-top:40px;border:1px solid rgba(239,106,95,.5);background:var(--red-dim);border-radius:var(--r-lg);padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.error-panel .eyebrow{color:var(--red)}
.error-panel h1,.error-panel h2{font-family:var(--f-story);font-weight:400;font-size:var(--t-xl);line-height:1.25}
.err-detail{margin:0;font-family:var(--f-mono);font-size:var(--t-xs);line-height:1.5;background:var(--bg-deep);border:1px solid var(--hair-2);border-radius:6px;padding:10px 12px;color:var(--muted);white-space:pre-wrap;overflow-x:auto}
.inline-error{border:1px solid rgba(239,106,95,.5);border-radius:8px;background:var(--red-dim);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;font-size:var(--t-sm)}
@keyframes dl-blink{50%{opacity:0}}
/* one-line note above the view, after a sync link was opened (inserted by ui.js before #view) */
.notice-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:16px;background:var(--surface);border:1px solid var(--hair-2);border-left:2px solid var(--amber);border-radius:8px;padding:10px 12px 10px 14px;font-size:var(--t-sm);line-height:1.5}
.notice-bar p{flex:1 1 240px;min-width:0}
.notice-bar.ok{border-left-color:var(--green)}
.notice-bar.bad{border-left-color:var(--red)}

/* ---------- section heads ---------- */
.sec-head{display:grid;gap:10px;margin-bottom:28px}
.eyebrow{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.sec-head h1,.sec-head h2{font-family:var(--f-story);font-size:var(--t-3xl);line-height:1.06;font-weight:400;letter-spacing:-.02em}
.sec-head h2{font-size:var(--t-2xl);line-height:1.12}
.lede{font-family:var(--f-story);font-size:var(--t-body);line-height:1.6;color:var(--muted);max-width:62ch}
.h-small{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:12px}
.case-crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:var(--t-xs);color:var(--muted);margin-bottom:14px}

/* ---------- buttons, chips, forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 14px;font-size:var(--t-ui);line-height:1.3;color:var(--fg);text-decoration:none;cursor:pointer;text-align:center;transition:border-color .15s,background .15s,box-shadow .15s}
.btn:hover:not(:disabled){border-color:var(--muted);text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{border-color:rgba(226,162,60,.55);color:var(--amber);background:var(--amber-dim);font-weight:500}
.btn-primary:hover:not(:disabled){border-color:var(--amber);background:rgba(226,162,60,.22);box-shadow:0 0 18px rgba(226,162,60,.14)}
.btn-danger{border-color:var(--red);color:var(--red);background:none}
.btn-danger:hover:not(:disabled){border-color:var(--red);background:var(--red-dim)}
.btn-ghost{background:none}
.btn-small{padding:4px 10px;font-size:var(--t-xs)}
.btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.btn[aria-pressed="true"]:disabled{opacity:1}
.btn.suggested{border-style:dashed;border-color:var(--muted)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-block;font-size:var(--t-2xs);line-height:1.5;letter-spacing:.02em;border:1px solid var(--hair-2);border-radius:999px;padding:1px 10px;color:var(--muted);white-space:nowrap}
.chip.ok{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.chip.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.chip.bad{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.chip.core{color:var(--fg)}
.status-line{font-size:var(--t-xs);color:var(--muted);min-height:1.6em}
.status-line.ok{color:var(--green)}
.status-line.bad{color:var(--red)}
/* copy buttons: a green "copied" state after a successful copy */
.btn-copy[data-copied="true"]{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.btn-copy[data-copied="true"]:hover:not(:disabled){border-color:var(--green);background:var(--green-dim)}
.field{display:grid;gap:6px;margin:0;padding:0;border:0;min-width:0;align-content:start}
.field-k{font-size:var(--t-sm);font-weight:500;color:var(--muted);padding:0}   /* v3.1.0: a label in sentence case, not a tiny eyebrow */
.field-help{font-size:var(--t-sm);line-height:1.55;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px}
.fields{align-items:start}
input[type="date"],input[type="number"],input[type="text"],select{width:100%;max-width:100%;background:var(--bg-deep);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font-size:var(--t-ui);color-scheme:dark}
input[type="date"]:focus-visible,input[type="number"]:focus-visible,input[type="text"]:focus-visible,select:focus-visible{border-color:var(--amber)}
textarea{display:block;width:100%;font:inherit;font-size:var(--t-ui);line-height:1.55;color:var(--fg);background:var(--bg-deep);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
textarea:focus-visible{border-color:var(--amber);outline:2px solid var(--amber);outline-offset:1px}
textarea[readonly]{background:var(--bg-deep);color:var(--muted);font-size:var(--t-xs)}
/* read-only fallback field (shown and selected when the clipboard refuses) and paste fields for links and codes */
textarea.copy-field{font-family:var(--f-mono);font-size:var(--t-xs);line-height:1.5;color:var(--fg);overflow-wrap:anywhere;word-break:break-all;max-height:220px}
textarea.paste-field{font-family:var(--f-mono);font-size:var(--t-sm);line-height:1.5;overflow-wrap:anywhere;word-break:break-all;background:var(--surface-2)}
textarea.paste-field::placeholder{color:var(--muted)}
input[type="range"]{width:100%;accent-color:var(--amber)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--amber)}
.seg-opts{display:flex;flex-wrap:wrap;gap:6px}
.seg-opts input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg-opts label{flex:1 1 160px;display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:var(--t-sm);background:var(--surface)}
.seg-opts label small{font-size:var(--t-xs);color:var(--muted)}
.seg-opts input:checked+label{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.seg-opts input:focus-visible+label{outline:2px solid var(--amber);outline-offset:2px}
.switch-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch-row label{font-size:var(--t-sm);cursor:pointer}
.switch-state{margin-left:auto;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);font-variant-numeric:tabular-nums}
input[type="checkbox"][role="switch"]{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
input[type="checkbox"][role="switch"]::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .2s}
input[type="checkbox"][role="switch"]:checked{background:var(--green)}
input[type="checkbox"][role="switch"]:checked::before{transform:translateX(18px);background:var(--bg)}

/* ---------- the post ---------- */
.post{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:18px 20px 18px 8px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
.vote{background:none;border:0;cursor:pointer;color:var(--faint);font-size:var(--t-ui);line-height:1;padding:4px}
.vote[aria-pressed="true"]{color:var(--amber)}
.vote-n{font-family:var(--f-mono);font-size:var(--t-xs);font-variant-numeric:tabular-nums;color:var(--muted)}
.post-body{min-width:0}
.post-meta{font-size:var(--t-xs);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.flair{background:none;border:1px solid var(--hair-2);border-radius:999px;padding:1px 9px;color:var(--amber)}
.user{color:var(--muted)}
.op-tag{color:var(--amber);font-weight:600;font-size:var(--t-2xs);letter-spacing:.08em}
.post-title{font-family:var(--f-story);font-size:var(--t-2xl);line-height:1.16;letter-spacing:-.016em;margin-block:14px 26px;font-weight:400}
.post-title.small{font-size:var(--t-xl);margin-block:8px 14px}
/* the story column: --t-story Newsreader (18 to 21px), about 66ch; the Reading panel sets body[data-text] and body[data-spacing] */
.story{font-family:var(--f-story);font-size:var(--t-story);line-height:1.75;color:var(--story-fg);display:grid;grid-template-columns:minmax(0,1fr);gap:1.1em;max-width:66ch;min-width:0}
body[data-text="l"] .story{font-size:calc(var(--t-story) * 1.12)}
body[data-text="xl"] .story{font-size:calc(var(--t-story) * 1.24)}
body[data-spacing="roomy"] .story,body[data-spacing="roomy"] .part2{line-height:1.9}
.story em{font-style:italic}
.beat-line{font-style:italic;color:var(--fg)}
.logline{margin:0;font-family:var(--f-mono);font-size:var(--t-xs);line-height:1.75;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--red);border-radius:8px;padding:12px 16px;overflow-x:auto;white-space:pre;color:var(--muted);max-width:100%}
.post-actions{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;font-size:var(--t-xs);color:var(--muted)}
/* lesson player: the lesson's post loses its card and its text column is centred */
body.lesson .post:not(.post-update){background:none;border-color:transparent}
body.lesson .post:not(.post-update) > .post-body{width:100%;max-width:660px;margin-inline:auto}

/* the typewritten note on paper */
.rules-note{margin:6px 0;background:var(--paper);color:var(--ink);font-family:var(--f-type);border-radius:2px;padding:22px 22px 18px;transform:rotate(-.7deg);box-shadow:var(--note-shadow);position:relative;max-width:560px}
.rules-note::before{content:"";position:absolute;top:-10px;left:42%;width:92px;height:22px;background:rgba(216,206,175,.45);border:1px solid rgba(185,173,139,.6);transform:rotate(3deg)}
.note-title{font-family:var(--f-type);font-weight:400;font-size:var(--t-body);letter-spacing:.06em;margin-bottom:10px}
.rules-note ol,.rules-note ul{margin:0;padding-left:24px;display:grid;gap:7px;font-size:var(--t-ui);line-height:1.45}
.rules-note p{font-size:var(--t-ui);line-height:1.45}
.rules-note .sig{margin-top:12px;text-align:right;font-size:var(--t-ui)}

/* attachments and diagram figures */
.attach,.diagram{margin:0;background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:14px;min-width:0;--dg-bg:var(--surface)}
.story .attach{font-family:var(--f-mono);font-size:var(--t-sm);line-height:1.65;color:var(--fg)}
.attach-label{font-family:var(--f-mono);font-size:var(--t-2xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.scroll-x{overflow-x:auto;max-width:100%}
figcaption{font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.6;color:var(--muted);margin-top:10px;max-width:66ch}
.diagram-error{font-size:var(--t-xs);color:var(--red)}
.fig-block{padding-top:24px}

/* comments */
.comments{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.comment{border-left:1px solid var(--hair-2);padding-left:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}
.comment .comment{margin-top:10px}
.c-meta{font-size:var(--t-xs);color:var(--muted)}
.comment p{font-size:var(--t-body);line-height:1.65;max-width:66ch}

/* reply to OP */
.reply-box{margin-top:28px;border:1px solid rgba(226,162,60,.4);border-radius:12px;padding:20px;background:var(--surface)}
.reply-h{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.reply-sub{font-family:var(--f-story);color:var(--muted);margin-block:8px 16px;font-size:var(--t-body);line-height:1.6;max-width:66ch}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;background:var(--bg-deep);border:1px solid var(--hair-2);border-radius:8px;padding:11px 12px;cursor:pointer;font-size:var(--t-ui);line-height:1.55;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--line)}
.choice[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-dim)}
.choice-k{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:6px;font-weight:600;color:var(--amber)}
.reply-result{margin-top:16px;border-top:1px solid var(--hair);padding-top:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.verdict{justify-self:start;font-size:var(--t-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.reply-result[data-tone="bad"] .verdict{color:var(--red);background:var(--red-dim)}
.reply-result[data-tone="warn"] .verdict{color:var(--amber);background:var(--amber-dim)}
.reply-result[data-tone="ok"] .verdict{color:var(--green);background:var(--green-dim)}
.part2-label{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.part2{margin:0;font-family:var(--f-story);font-style:italic;font-size:var(--t-story);line-height:1.75;color:var(--story-fg);border-left:1px solid var(--line);padding-left:16px;max-width:66ch}
.senior{font-size:var(--t-sm);line-height:1.65;max-width:66ch}
.senior strong{color:var(--amber);font-weight:600}
.reply-first{font-size:var(--t-xs);color:var(--muted)}

/* ---------- diagrams (classes emitted by engine/diagram.js; colors come only from here) ----------
   Tone and state colors travel as inherited custom properties, so they work whether the class sits on a
   <g> or on the shape itself. Rules are qualified by element so a group never passes fill or stroke to its
   text, and there are no bare element rules that would override fill="currentColor" on arrowheads.
   The label halo color comes from --dg-bg, set by the container (.attach, .diagram, .sim-canvas). */
.dg{display:block;width:100%;height:auto;margin-inline:auto;color:var(--faint)}
.dg text{font-family:var(--f-mono);fill:var(--fg);stroke:none;font-size:12px}
.tone-ok{--tone:var(--green);--tone-dim:var(--green-dim)}
.tone-warn{--tone:var(--amber);--tone-dim:var(--amber-dim)}
.tone-bad{--tone:var(--red);--tone-dim:var(--red-dim)}
.tone-muted{--tone:var(--faint);--tone-dim:rgba(122,131,139,.12)}
.tone-accent{--tone:var(--amber);--tone-dim:var(--amber-dim)}
.dg rect.dg-group,.dg .dg-group rect{fill:none;stroke:var(--line);stroke-dasharray:5 5}
.dg .dg-group-label{fill:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.dg .dg-node rect,.dg .dg-node ellipse,.dg .dg-node path,.dg .dg-node circle,.dg .dg-node polygon{fill:var(--n-fill,var(--surface-2));stroke:var(--n-stroke,var(--line));stroke-width:1.5;transition:stroke .2s,fill .2s}
.dg .dg-label{fill:var(--n-label,var(--fg));font-size:13px;font-weight:600}
.dg .dg-sub{fill:var(--n-text,var(--muted));font-size:12px}
.dg .dg-meta{fill:var(--muted);font-size:11px}
.dg-node[role="button"]{cursor:pointer}
.dg-node:focus{outline:none}
.dg-node:focus-visible{--n-stroke:var(--amber)}
.dg .dg-node:focus-visible rect,.dg .dg-node:focus-visible ellipse,.dg .dg-node:focus-visible path,.dg .dg-node:focus-visible circle{stroke-width:3}
.dg-node[role="button"]:not([class*="st-"]):not([class*="tone-"]):hover{--n-stroke:var(--muted)}
.dg-node.st-ok,.dg-node.tone-ok{--n-stroke:var(--green)}
.dg-node.st-warn,.dg-node.tone-warn{--n-stroke:var(--amber);--n-fill:var(--amber-dim);--n-text:var(--amber)}
.dg-node.st-bad,.dg-node.tone-bad{--n-stroke:var(--red);--n-fill:var(--red-dim);--n-text:var(--red)}
.dg-node.st-zombie{--n-stroke:var(--red);--n-fill:var(--red-dim);--n-text:var(--red)}
.dg-node.st-muted,.dg-node.tone-muted{opacity:.7}
.dg-node.st-accent,.dg-node.tone-accent{--n-stroke:var(--amber);--n-label:var(--amber)}
.dg .dg-node.st-bad .dg-sub,.dg .dg-node.st-zombie .dg-sub{font-weight:600}
.dg .dg-node.st-zombie rect,.dg .dg-node.st-zombie ellipse,.dg .dg-node.st-zombie path{stroke-dasharray:6 3;animation:dl-flicker 1.1s steps(2) infinite}
.dg .dg-edge{fill:none;stroke:var(--tone,currentColor);stroke-width:1.5}
.dg .dg-edge.cut{stroke:var(--red);stroke-dasharray:4 4;opacity:.55}
.dg .dg-edge-label{fill:var(--tone,var(--muted));font-size:11px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg .dg-note{fill:var(--tone,var(--fg));font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
/* sequence */
.dg rect.dg-lane,.dg .dg-lane rect{fill:var(--surface-2);stroke:var(--line)}
.dg text.dg-lane,.dg .dg-lane text{fill:var(--fg);font-size:12px;font-weight:600}
.dg line.dg-lifeline,.dg path.dg-lifeline,.dg .dg-lifeline line{fill:none;stroke:var(--faint);stroke-dasharray:3 5}
.dg line.dg-msg,.dg path.dg-msg,.dg polyline.dg-msg,.dg .dg-msg line,.dg .dg-msg path,.dg .dg-msg polyline{fill:none;stroke:var(--tone,var(--muted));stroke-width:1.4}
.dg text.dg-msg,.dg .dg-msg text{fill:var(--tone,var(--fg));font-size:11.5px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg rect.dg-span,.dg .dg-span rect{fill:var(--tone-dim,var(--amber-dim));stroke:var(--tone,var(--amber));stroke-dasharray:4 3}
.dg text.dg-span,.dg .dg-span text{fill:var(--tone,var(--fg));font-size:11.5px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg rect.dg-notebox,.dg .dg-notebox rect{fill:var(--surface-2);stroke:var(--tone,var(--amber))}
.dg text.dg-notebox,.dg .dg-notebox text{fill:var(--fg);font-size:11.5px}
.dg .dg-notebox .dg-sub,.dg text.dg-notebox.dg-sub{fill:var(--tone,var(--amber))}
.dg rect.dg-outcome,.dg .dg-outcome rect{fill:var(--tone-dim,var(--surface));stroke:var(--tone,var(--line))}
.dg text.dg-outcome,.dg .dg-outcome text{fill:var(--fg);font-size:11.5px;font-weight:600}
/* timeline */
.dg line.dg-ticks,.dg path.dg-ticks,.dg .dg-ticks line,.dg .dg-ticks path{fill:none;stroke:var(--tone,var(--green))}
.dg line.dg-flat,.dg path.dg-flat,.dg .dg-flat line,.dg .dg-flat path{fill:none;stroke:var(--tone,var(--red));stroke-width:1.5}
.dg rect.dg-gap,.dg .dg-gap rect{fill:var(--tone-dim,var(--red-dim));stroke:none}
.dg text.dg-gap,.dg .dg-gap text,.dg text.dg-flat,.dg .dg-flat text{fill:var(--tone,var(--red));font-size:11px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg line.dg-marker,.dg path.dg-marker,.dg .dg-marker line,.dg .dg-marker path{fill:none;stroke:var(--tone,var(--amber));stroke-width:1.2;stroke-dasharray:4 4}
.dg text.dg-marker,.dg .dg-marker text{fill:var(--tone,var(--amber));font-size:11px;paint-order:stroke;stroke:var(--dg-bg,var(--surface-2));stroke-width:5px;stroke-linejoin:round}
.dg line.dg-axis,.dg path.dg-axis,.dg .dg-axis line,.dg .dg-axis path{fill:none;stroke:var(--faint);stroke-width:1}
.dg text.dg-axis,.dg .dg-axis text{fill:var(--muted);font-size:11px}
/* moving dots (drawn by sims in the diagram's dots layer) */
.dg .dot{fill:var(--fg);transition:fill .2s}
.dg .dot-req{fill:var(--fg);opacity:.85}
.dg .dot-wait{fill:var(--amber)}
.dg .dot-fail{fill:var(--red)}
.dg .dot-ok{fill:var(--green)}
.dg .dot-bad{fill:var(--red-dim);stroke:var(--red);stroke-width:2.2}
.dg .dot-accent{fill:var(--amber)}
@keyframes dl-flicker{0%{opacity:1}50%{opacity:.55}}

/* ---------- sims (layout built by engine/sim.js) ---------- */
.sim-section .sec-head{margin-bottom:18px}
.sim-host{min-width:0}
.sim-placeholder{border:1px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);padding:28px 18px;display:grid;gap:12px;justify-items:start}
.sim-placeholder p{color:var(--muted);font-size:var(--t-sm)}
.try{font-size:var(--t-sm);color:var(--muted);line-height:1.65;max-width:66ch;margin-top:12px}
.try strong{color:var(--fg);font-weight:600}
.sim{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.sim-stage{min-width:0;background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:12px}
.sim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 4px 8px;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted)}
.sim-clock{font-family:var(--f-mono);font-size:var(--t-lg);font-weight:500;font-variant-numeric:tabular-nums;color:var(--amber);letter-spacing:.08em;text-shadow:0 0 14px var(--amber-glow)}
.sim-canvas{overflow-x:auto;border-radius:8px;background:var(--bg-deep);border:1px solid var(--hair);min-width:0;--dg-bg:var(--bg-deep);font-family:var(--f-mono)}
.sim-canvas .dg{min-width:620px}
.sim-canvas pre,.sim-canvas code{font-family:var(--f-mono);font-size:var(--t-xs)}
.sim-canvas table{border-collapse:collapse;font-size:var(--t-xs)}
.sim-canvas th,.sim-canvas td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--hair-2)}
.sim-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px;font-family:var(--f-mono)}
.sim-stats:empty{display:none}
.sim-stat{background:var(--bg-deep);border:1px solid var(--hair-2);border-radius:8px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.sim-stat-v{font-size:var(--t-lg);font-weight:500;font-variant-numeric:tabular-nums}
.sim-stat-k{font-size:var(--t-2xs);color:var(--muted);letter-spacing:.04em}
.sim-stat.ok .sim-stat-v{color:var(--green)}
.sim-stat.warn .sim-stat-v{color:var(--amber)}
.sim-stat.bad .sim-stat-v{color:var(--red)}
.sim-info{margin-top:12px;border-left:2px solid var(--amber);padding:6px 12px;font-size:var(--t-sm);line-height:1.65;max-width:66ch;min-height:52px}
.sim-info:empty{display:none}
.sim-info strong{color:var(--amber);font-weight:600}
.sim-controls{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:14px;display:flex;flex-wrap:wrap;align-content:start;gap:12px 8px;min-width:0}
.sim-ctl{flex:1 1 100%;display:grid;gap:6px;min-width:0;margin:0;padding:0;border:0}
.sim-ctl:has(> button:only-child){flex-basis:calc(50% - 4px)}
.sim-ctl label,.sim-ctl legend,.sim-ctl .sim-ctl-k{font-family:var(--f-mono);font-size:var(--t-2xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;padding:0}
.sim-ctl output{font-family:var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums;margin-left:auto}
.sim-ctl button{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:var(--t-sm);line-height:1.3;color:var(--fg);cursor:pointer}
.sim-ctl button:hover:not(:disabled){border-color:var(--muted)}
.sim-ctl button:disabled{opacity:.4;cursor:not-allowed}
.sim-ctl button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.sim-ctl select{width:100%}
.sim-log{flex:1 1 100%;list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--hair);display:grid;gap:6px;font-family:var(--f-mono);font-size:var(--t-xs);max-height:280px;overflow-y:auto;min-width:0}
.sim-log:empty{display:none}
.sim-log li{line-height:1.45}
.sim-log time,.sim-log .t{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px}
.sim-log li.t-ok{color:var(--green)}
.sim-log li.t-warn{color:var(--amber)}
.sim-log li.t-bad{color:var(--red)}

/* ---------- what actually happened ---------- */
.oneline{font-family:var(--f-story);font-size:var(--t-xl);line-height:1.4;font-style:italic;color:var(--fg);max-width:52ch}
.rule-tie{font-size:var(--t-xs);color:var(--amber)}
.steps{margin:0;padding-left:22px;display:grid;gap:12px;max-width:66ch;font-size:var(--t-body);line-height:1.65}
.steps li{padding-left:4px}
.steps li::marker{color:var(--faint)}
.steps strong{color:var(--fg)}
.block{margin-top:30px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.block h3{font-family:var(--f-story);font-size:var(--t-lg);font-weight:400;line-height:1.3}
.block p{max-width:66ch;font-size:var(--t-body);line-height:1.65}
.limits{margin:0;padding-left:20px;display:grid;gap:6px;max-width:66ch;line-height:1.65}
.table-wrap{overflow-x:auto;max-width:100%}
.tradeoff{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.tradeoff th,.tradeoff td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--hair-2);vertical-align:top;min-width:120px}
.tradeoff th{font-family:var(--f-mono);font-size:var(--t-2xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.pull{font-family:var(--f-story);font-size:var(--t-xl);line-height:1.35;border-left:2px solid var(--amber);padding-left:18px;max-width:40ch}
.pull-by{font-size:var(--t-xs);color:var(--muted)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px;margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;min-width:0}
.panel h3{font-family:var(--f-mono);font-size:var(--t-xs);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.panel p,.panel li{font-size:var(--t-sm);line-height:1.65;max-width:66ch}
.panel ul{margin:0;padding-left:18px;display:grid;gap:4px}
.src-link{font-size:var(--t-xs)}
.sources ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:var(--t-xs);color:var(--muted)}

/* ---------- words, at work, pin it, notes box, close ---------- */
.terms{border:1px solid var(--hair-2);border-radius:var(--r-lg);background:var(--surface)}
.terms summary{cursor:pointer;padding:13px 16px;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.term-list{margin:0;padding:0 16px 16px;display:grid;gap:0}
.term-list dt{font-family:var(--f-story);font-size:var(--t-lg);font-weight:400;color:var(--fg);padding-top:10px;border-top:1px solid var(--hair)}
.term-list dd{margin:2px 0 10px;font-family:var(--f-story);color:var(--muted);font-size:var(--t-body);line-height:1.65;max-width:66ch}
.at-work{border-left:2px solid var(--amber);padding:4px 0 4px 16px;line-height:1.65;max-width:66ch}
.part-head{font-family:var(--f-story);font-size:var(--t-2xl);font-weight:400;line-height:1.15;letter-spacing:-.015em}
.recall{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.recall-q{font-family:var(--f-story);font-size:var(--t-body);line-height:1.6;max-width:64ch}
.recall > .btn,.recall > .btn-row{justify-self:start}
.opts{display:grid;gap:6px}
.opt{display:block;width:100%;text-align:left;background:var(--bg-deep);border:1px solid var(--hair-2);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:var(--t-ui);line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--line)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.opt.right{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.opt.wrong{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.feedback{border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-size:var(--t-sm);background:var(--surface)}
.feedback:empty{display:none}
.marks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.marks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.mark-ok{color:var(--green);font-weight:600}
.mark-no{color:var(--red);font-weight:600}
.model{border-left:1px solid var(--line);padding-left:14px;display:grid;gap:4px}
.model p{font-family:var(--f-story);font-size:var(--t-body);line-height:1.65;color:var(--story-fg);max-width:66ch}
.verdict-line{font-weight:600}
.verdict-line.ok{color:var(--green)}
.verdict-line.bad{color:var(--red)}
.next-line{font-size:var(--t-sm);color:var(--green)}
.ai-notice{font-size:var(--t-sm);line-height:1.6;color:var(--muted);border-left:2px solid var(--amber);padding:2px 0 2px 10px;max-width:66ch}
/* "Get a deeper grade from Claude" under a free-text result */
.deep-grade{border-top:1px solid var(--hair);padding-top:12px;margin-top:2px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.deep-grade .field-help{max-width:62ch}
.close-box{border:1px solid var(--hair-2);border-radius:12px;background:var(--surface);padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.close-box.done{border-color:rgba(116,194,142,.5);background:var(--surface)}
.teaser{font-family:var(--f-story);font-style:italic;font-size:var(--t-story);line-height:1.55;color:var(--story-fg);border-left:2px solid var(--amber);padding-left:16px;max-width:62ch}

/* ---------- tonight ---------- */
.pace-box{border-left:2px solid var(--green);padding:4px 0 4px 16px;display:grid;gap:6px;margin-bottom:28px}
.pace-box[data-status="behind"],.pace-box[data-status="past-target"]{border-left-color:var(--amber)}
.pace{font-family:var(--f-story);font-size:var(--t-xl);line-height:1.35;max-width:52ch}
.pace-sub{font-size:var(--t-xs);color:var(--muted)}
.callout{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:28px}
.callout.due{border-color:rgba(226,162,60,.45)}
.callout p{max-width:56ch}
.sessions{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.session{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:14px 16px}
.session.ready:hover{border-color:var(--line)}
.session.ready:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.session.planned{opacity:1;border-style:dashed;border-color:var(--line);background:none}
.session.planned .session-k{color:var(--muted)}
.session.planned .session-title{color:var(--muted)}
.session-k{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:500;color:var(--amber);line-height:1.9}
.session-title{font-family:var(--f-story);font-size:var(--t-lg);font-weight:400;line-height:1.25}
.session-title a{color:var(--fg);text-decoration:none}
.session-title a::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg)}
.session-title a:focus-visible{outline:none}
.session-setting{font-family:var(--f-story);font-style:italic;color:var(--muted);font-size:var(--t-body);margin-block:2px 8px}
.more-line{margin-top:18px;font-size:var(--t-xs);color:var(--muted)}
.more-line a{color:var(--muted)}
.storage-line{margin-top:48px;padding-top:14px;border-top:1px solid var(--hair);font-size:var(--t-xs);line-height:1.6;color:var(--muted)}
.card-panel{background:var(--surface);border:1px solid rgba(226,162,60,.4);border-radius:12px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

/* ---------- seasons ---------- */
.seasons{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.season-block{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:14px 16px}
.season-block.here{border-color:rgba(226,162,60,.45)}
.season-block.solved{border-color:rgba(116,194,142,.4)}
.season-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start}
.s-n{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:500;line-height:2;color:var(--amber);white-space:nowrap}
.season-head h2{font-family:var(--f-story);font-size:var(--t-xl);line-height:1.2;font-weight:400;letter-spacing:-.01em}
.s-rank{font-size:var(--t-xs);color:var(--muted);margin-top:2px}   /* v3.1.0: sentence case, not an eyebrow */
.s-blurb{font-family:var(--f-story);font-size:var(--t-body);line-height:1.6;color:var(--muted);margin-top:4px;max-width:66ch}
.season-items{list-style:none;margin:12px 0 0;padding:12px 0 0 56px;border-top:1px solid var(--hair);display:grid;gap:8px}
.season-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:var(--t-sm)}
.si-mark{color:var(--faint);text-align:center}
.si-mark.done{color:var(--green);font-weight:600}
.si-mark.ready{color:var(--amber)}
.si-title{font-family:var(--f-story);font-size:var(--t-lg);line-height:1.35}
.si-title a{color:var(--fg);text-decoration:none}
.si-title a:hover{text-decoration:underline;text-decoration-color:var(--line)}
.si-kind{display:block;font-family:var(--f-ui);font-size:var(--t-xs);line-height:1.5;color:var(--muted)}
.season-item .chips{justify-content:flex-end}
.season-empty{font-size:var(--t-xs);color:var(--muted)}
.season-det > summary{list-style:none;cursor:pointer}
.season-det > summary::-webkit-details-marker{display:none}
.season-det > summary::marker{content:""}
.season-det > summary:focus-visible{outline:2px solid var(--amber);outline-offset:4px;border-radius:4px}
.season-det > summary .s-n::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);vertical-align:2px;transition:transform .15s}
.season-det[open] > summary .s-n::after{transform:rotate(45deg)}
.season-det:not([open]) > summary{margin-bottom:0}
.s-prog{height:2px;background:var(--hair-2);border-radius:2px;overflow:hidden;margin-top:12px;max-width:320px}
.s-prog-fill{display:block;height:100%;background:var(--amber);border-radius:2px;box-shadow:0 0 8px var(--amber-glow)}
.season-block.solved .s-prog-fill{background:var(--green);box-shadow:none}
.course-prog{font-size:var(--t-xs);color:var(--muted);flex-basis:100%;margin:0}
.empty-state{border:1px dashed var(--line);border-radius:var(--r-lg);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:8px}
.empty-title{font-family:var(--f-story);font-weight:400;font-size:var(--t-xl);color:var(--fg);margin:0}

/* ---------- rulebook ---------- */
.rulebook{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rule{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:16px}
.rule-n{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:500;color:var(--amber);line-height:1.6}
.rule-text{font-family:var(--f-type);font-size:var(--t-body);line-height:1.5;color:var(--fg)}
.rule-why{font-size:var(--t-sm);line-height:1.6;color:var(--muted);margin-top:6px;max-width:64ch}
.rule-why .tag{color:var(--fg)}
.redacted{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.redacted span{display:block;height:12px;background:var(--hair-2);border-radius:2px}
.rule-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.rule-status .chip{white-space:normal}
.rule.fading{border-color:rgba(226,162,60,.45)}
.rule.fading .rule-text{opacity:.62}
.rule.locked .rule-text{opacity:.85}
.rule.known{border-color:rgba(116,194,142,.4)}

/* ---------- cold cases ---------- */
.review-progress{font-family:var(--f-mono);font-size:var(--t-2xs);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.post.post-update{grid-template-columns:minmax(0,1fr);padding:18px 20px}
.post-update .story{font-size:var(--t-story)}
.gp-reply{border-left:2px solid var(--amber);padding-left:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.gp-reply .c-meta{font-family:var(--f-ui)}
.review-answer{margin-top:16px}
.shift-over{border:1px solid var(--hair-2);border-radius:12px;background:var(--surface);padding:22px;display:grid;gap:10px}
.shift-over h2{font-family:var(--f-story);font-weight:400;font-size:var(--t-2xl);letter-spacing:-.015em}

/* ---------- 3 AM interview ---------- */
.iv-level{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.iv-room{background:var(--surface);border:1px solid rgba(226,162,60,.4);border-radius:12px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.iv-steps{margin:0;padding-left:22px;display:grid;gap:10px;max-width:66ch;font-size:var(--t-sm);line-height:1.65}
.iv-steps li{padding-left:4px}
.iv-steps li::marker{color:var(--faint)}
.iv-steps strong{color:var(--fg);font-weight:600}
.dim-line{font-size:var(--t-xs);color:var(--muted)}
.dim-line code{font-family:var(--f-mono);color:var(--muted);background:var(--bg-deep);border:1px solid var(--hair-2);border-radius:4px;padding:0 5px}
.attempts{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:var(--t-sm);max-width:420px}
.attempts li{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:6px}
.attempt-score{font-family:var(--f-mono);font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}

/* ---------- evidence board (built by ui.js) ---------- */
.board{margin:0;min-width:0}
.board .scroll-x{border-radius:var(--r-lg);border:1px solid var(--hair-2)}
.board svg{display:block;width:100%;height:auto;margin-inline:auto}
.bd-cork{fill:var(--cork);stroke:var(--line)}
.bd-col{fill:var(--muted);font-size:11px;letter-spacing:.08em}
.bd-string{fill:none;stroke:var(--red);stroke-width:1.6;opacity:.85}
.bd-lbl{fill:var(--fg);font-size:11px;paint-order:stroke;stroke:var(--cork);stroke-width:5px;stroke-linejoin:round}
.bd-card rect{fill:var(--paper);stroke:var(--paper-edge)}
.bd-pin{fill:var(--red)}
.bd-title{fill:var(--ink);font-size:12.5px;font-weight:600}
.bd-sub{fill:var(--ink);font-size:11px;opacity:.75}
.bd-card.fading rect{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 3}
.bd-card.fading .bd-title{opacity:.7}
.bd-crack{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.board-list{margin-top:14px}
.board-list ul{margin:0;padding:0 14px 14px 32px;display:grid;gap:4px;font-size:var(--t-sm)}

/* ---------- notes ---------- */
.notes-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.note-item{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.note-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between;font-size:var(--t-xs);color:var(--muted)}
.note-head a{font-family:var(--f-story);font-size:var(--t-lg);color:var(--fg);text-decoration:none}
.note-head a:hover{text-decoration:underline;text-decoration-color:var(--line)}
.note-text{font-family:var(--f-story);font-size:var(--t-body);line-height:1.65;color:var(--story-fg);white-space:pre-wrap;max-width:66ch}

/* ---------- settings ---------- */
.settings-group{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px}
.settings-group > h2{font-family:var(--f-mono);font-size:var(--t-xs);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.settings-group.danger{border-color:rgba(239,106,95,.35)}
.settings-group.danger > h2{color:var(--red)}
.confirm{border:1px solid rgba(239,106,95,.55);background:var(--red-dim);border-radius:8px;padding:14px;display:grid;gap:10px}
.settings-group.sync-card{border-color:rgba(226,162,60,.4)}
.sync-lead{font-family:var(--f-story);font-size:var(--t-lg);line-height:1.45;max-width:56ch}
/* a one-off line at the top of Settings (after a delete or a merge), with an optional Retry button */
.flash{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border-left:2px solid var(--amber);padding:4px 0 4px 12px;font-size:var(--t-sm);color:var(--fg)}
.flash p{flex:1 1 240px;min-width:0}
.flash.ok{border-left-color:var(--green)}
.flash.warn{border-left-color:var(--amber)}
.flash.bad{border-left-color:var(--red)}

/* ---------- two courses: board switcher, course chips, LATENT accent (v1.1.0, switcher moved into the view in v2.0.0) ---------- */
/* the in-view switcher on Seasons and Evidence: All, Dead Letter, LATENT as one row of pills */
.board-switch-inline{display:inline-flex;flex-wrap:wrap;gap:2px;max-width:100%;min-width:0;padding:3px;margin:0 0 28px;border:1px solid var(--line);border-radius:999px}
.board-btn{display:inline-grid;align-content:center;justify-items:start;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 15px;font-size:var(--t-xs);line-height:1.35;color:var(--muted);text-align:left;cursor:pointer;transition:background .15s,color .15s}
.board-btn:hover{border-color:var(--muted);color:var(--fg)}
.board-btn-name{font-weight:500}
.board-btn-board{font-size:var(--t-2xs);color:var(--muted);overflow-wrap:anywhere}
.board-btn[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-dim);color:var(--fg)}
.board-btn[aria-pressed="true"] .board-btn-name{color:var(--amber)}
.board-btn[data-board="lt"][aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-dim)}
.board-btn[data-board="lt"][aria-pressed="true"] .board-btn-name{color:var(--cyan)}
.board-switch-inline .board-btn{display:inline-flex;align-items:center;justify-content:center;border-color:transparent;background:none;white-space:nowrap;text-align:center}
.board-switch-inline .board-btn:hover{border-color:transparent}
.board-switch-inline .board-btn-board{display:none}
.board-switch-inline .board-btn[aria-pressed="true"]{border-color:transparent;background:var(--surface-2);color:var(--fg)}
.board-switch-inline .board-btn[aria-pressed="true"] .board-btn-name{color:var(--fg)}
.board-switch-inline .board-btn[data-board="dl"][aria-pressed="true"],.board-switch-inline .board-btn[data-board="dl"][aria-pressed="true"] .board-btn-name{color:var(--amber)}
.board-switch-inline .board-btn[data-board="lt"][aria-pressed="true"]{background:var(--surface-2);color:var(--cyan)}
.board-switch-inline .board-btn[data-board="lt"][aria-pressed="true"] .board-btn-name{color:var(--cyan)}
/* the small course chip on every session card */
.chip-course{color:var(--amber);border-color:rgba(226,162,60,.45)}
.chip-course[data-course="lt"]{color:var(--cyan);border-color:rgba(95,179,201,.45)}
.filter-note{font-size:var(--t-xs);color:var(--muted);border-left:1px solid var(--line);padding:2px 0 2px 12px;margin-bottom:16px}

/* .course-lt sits on #view for LATENT case, interview and Build Night pages. It remaps the accent usages
   (links, focus rings, eyebrows, chips, primary and pressed buttons, the reply box and verdict-ok borders,
   panel heads, side rules, the interview room, sim and diagram accents) from amber to cyan. :where() keeps each
   override at the specificity of the rule it remaps, so more specific rules still win (fg title links, red
   error eyebrows, green copied buttons). Semantic amber (warn chips, behind pace, fading, diagram warn states)
   is not remapped. New rules below read var(--accent), which only .course-lt sets. */
.course-lt{--accent:var(--cyan);--accent-dim:var(--cyan-dim)}
:where(.course-lt) a{color:var(--cyan)}
:where(.course-lt) :focus-visible{outline-color:var(--cyan)}
:where(.course-lt) textarea:focus-visible{border-color:var(--cyan);outline-color:var(--cyan)}
:where(.course-lt) input[type="date"]:focus-visible,:where(.course-lt) input[type="number"]:focus-visible,:where(.course-lt) input[type="text"]:focus-visible,:where(.course-lt) select:focus-visible{border-color:var(--cyan)}
:where(.course-lt) input[type="range"]{accent-color:var(--cyan)}
:where(.course-lt) input[type="checkbox"],:where(.course-lt) input[type="radio"]{accent-color:var(--cyan)}
:where(.course-lt) .eyebrow{color:var(--cyan)}
:where(.course-lt) .chip.core{border-color:rgba(95,179,201,.5)}
:where(.course-lt) .btn-primary{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
:where(.course-lt) .btn-primary:hover:not(:disabled){border-color:var(--cyan);background:rgba(95,179,201,.22)}
:where(.course-lt) .btn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
:where(.course-lt) .vote[aria-pressed="true"]{color:var(--cyan)}
:where(.course-lt) .op-tag{color:var(--cyan)}
:where(.course-lt) .reply-box{border-color:var(--cyan)}
:where(.course-lt) .reply-h{color:var(--cyan)}
:where(.course-lt) .choice[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-dim)}
:where(.course-lt) .choice-k{color:var(--cyan)}
:where(.course-lt) .senior strong{color:var(--cyan)}
:where(.course-lt) .reply-result[data-tone="ok"] .verdict{border-color:var(--cyan)}
:where(.course-lt) .rule-tie{color:var(--cyan)}
:where(.course-lt) .pull{border-left-color:var(--cyan)}
:where(.course-lt) .panel h3{color:var(--cyan)}
:where(.course-lt) .terms summary{color:var(--cyan)}
:where(.course-lt) .at-work{border-left-color:var(--cyan)}
:where(.course-lt) .teaser{border-left-color:var(--cyan)}
:where(.course-lt) .ai-notice{border-left-color:var(--cyan)}
:where(.course-lt) .iv-level{color:var(--cyan)}
:where(.course-lt) .iv-room{border-color:var(--cyan)}
:where(.course-lt) .sim-clock{color:var(--cyan)}
:where(.course-lt) .sim-info{border-left-color:var(--cyan)}
:where(.course-lt) .sim-info strong{color:var(--cyan)}
:where(.course-lt) .sim-ctl button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
:where(.course-lt) .tone-accent{--tone:var(--cyan);--tone-dim:var(--cyan-dim)}
:where(.course-lt) .dg-node.st-accent,:where(.course-lt) .dg-node.tone-accent{--n-stroke:var(--cyan);--n-label:var(--cyan)}
:where(.course-lt) .dg-node:focus-visible{--n-stroke:var(--cyan)}
:where(.course-lt) .dg .dot-accent{fill:var(--cyan)}

/* ---------- Tonight: Build Night cards ---------- */
.session-project{font-family:var(--f-mono);font-size:var(--t-2xs);letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:2px}
.session.build{border-style:dashed;border-color:var(--dash);background:none}
.session.build .session-k{font-size:var(--t-sm)}
.session.build .session-title{margin-bottom:8px}
.session.build .btn-row{margin-top:12px}

/* ---------- Seasons: course groups and Projects ---------- */
.course-group{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:36px}
.sec-head + .course-group,.filter-note + .course-group{margin-top:0}
.course-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding-bottom:10px;border-bottom:1px solid var(--hair)}
.course-head h2{font-family:var(--f-mono);font-size:var(--t-xs);line-height:1.6;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.course-board{font-size:var(--t-xs);color:var(--muted)}
.course-tag{flex:1 1 100%;font-family:var(--f-story);font-size:var(--t-ui);color:var(--muted);max-width:66ch}
.course-group[data-course="lt"] .course-board,.course-group[data-course="lt"] .s-n{color:var(--cyan)}
.course-group[data-course="lt"] .course-head h2{color:var(--cyan)}
.season-head h3{font-family:var(--f-story);font-size:var(--t-xl);line-height:1.2;font-weight:400;letter-spacing:-.01em}
.projects .s-n{color:var(--muted)}
.milestone .si-kind{font-variant-numeric:tabular-nums}

/* ---------- Build Night  #build/<id> ---------- */
.build-meta{font-size:var(--t-xs);color:var(--muted)}
.build-h{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--accent,var(--amber));font-weight:500}
.build-h label{cursor:pointer}
.build-unlock{border:1px solid var(--hair-2);border-left:2px solid var(--green);border-radius:var(--r-lg);background:var(--surface);padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;font-size:var(--t-sm)}
.build-unlock[data-state="locked"]{border-left-color:var(--faint)}
.unlock-list{margin:0;padding-left:20px;display:grid;gap:4px}
.spec{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-family:var(--f-story);font-size:var(--t-story);line-height:1.7;color:var(--story-fg);max-width:66ch}
.spec ul{margin:0;padding-left:22px;display:grid;gap:6px}
/* the prompt pack: a read-only mono block that scrolls sideways inside itself */
.prompt-pack{margin:0;max-width:100%;overflow-x:auto;white-space:pre;tab-size:2;font-family:var(--f-mono);font-size:var(--t-xs);line-height:1.6;color:var(--fg);background:var(--bg-deep);border:1px solid var(--hair-2);border-left:2px solid var(--accent,var(--amber));border-radius:8px;padding:12px 14px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:66ch}
.checklist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:var(--t-sm)}
.checklist input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent,var(--amber))}
.checklist label{cursor:pointer}
.checklist input:checked+label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.cmd-block{margin:0;max-width:100%;overflow-x:auto;white-space:pre;font-family:var(--f-mono);font-size:var(--t-sm);line-height:1.6;color:var(--fg);background:var(--bg-deep);border:1px solid var(--hair-2);border-radius:8px;padding:10px 12px}
.inline-code{font-family:var(--f-mono);font-size:.92em;color:var(--fg);background:var(--bg-deep);border:1px solid var(--hair-2);border-radius:4px;padding:0 5px;overflow-wrap:anywhere}
/* the GitHub check: checking, found, missing, no-repo, rate-limited, error */
.verify-result{border:1px solid var(--hair-2);border-left:2px solid var(--faint);border-radius:8px;background:var(--surface);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;font-size:var(--t-sm)}
.verify-k{font-family:var(--f-mono);font-size:var(--t-2xs);letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.verify-result[data-status="found"]{border-left-color:var(--green)}
.verify-result[data-status="found"] .verify-k{color:var(--green)}
.verify-result[data-status="missing"],.verify-result[data-status="no-repo"],.verify-result[data-status="rate-limited"]{border-left-color:var(--amber)}
.verify-result[data-status="missing"] .verify-k,.verify-result[data-status="no-repo"] .verify-k,.verify-result[data-status="rate-limited"] .verify-k{color:var(--amber)}
.verify-result[data-status="error"]{border-left-color:var(--red)}
.verify-result[data-status="error"] .verify-k{color:var(--red)}
.btn[aria-busy="true"]{cursor:progress}
.build-done{border:1px solid rgba(116,194,142,.5);border-radius:var(--r-lg);background:var(--surface);padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;font-size:var(--t-sm)}
.build-note{font-family:var(--f-story);font-size:var(--t-body);line-height:1.65;color:var(--story-fg);white-space:pre-wrap;max-width:64ch}
/* "I built it, mark as self-reported": a secondary action, styled as a link */
.btn-link{background:none;border:0;padding:4px 0;font-size:var(--t-xs);color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.btn-link:hover:not(:disabled){color:var(--fg)}
.btn-link:disabled{opacity:.45;cursor:not-allowed}
.share-hint{border-left:2px solid var(--accent,var(--amber));padding:4px 0 4px 12px;font-size:var(--t-sm);max-width:62ch}
@media (max-width: 520px){
  .board-btn{padding:6px 10px}
  .prompt-pack{padding:10px 12px}
  .session.build .btn-row .btn{flex:1 1 100%}
}

/* ---------- Tonight: status strip, hero, night bar, queue (v2.0.0) ---------- */
.tonight{padding-top:44px}
.status-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:var(--t-xs);line-height:1.5;color:var(--muted)}
.ss-status{display:inline-flex;align-items:center;gap:8px;color:var(--green);white-space:nowrap}
.ss-status i{flex:none;width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.ss-status[data-status="behind"]{color:var(--amber)}
.ss-status[data-status="past-target"]{color:var(--red)}
.ss-status[data-status="done"]{color:var(--green)}
.ss-item{white-space:nowrap}
.ss-item b{font-weight:500;color:var(--fg)}
.ss-plan{white-space:normal}
.ss-new{margin-left:auto;display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--muted)}
.ss-new a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ss-new a:hover{color:var(--fg)}
.ss-x{background:none;border:0;padding:2px 6px;font-size:var(--t-ui);line-height:1;color:var(--faint)}
.ss-x:hover{color:var(--fg)}
.ss-action{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;font-size:var(--t-xs);color:var(--muted)}
.hero{margin:40px 0 16px;font-family:var(--f-story);font-weight:400;font-size:var(--t-3xl);line-height:1.08;letter-spacing:-.022em;color:var(--fg)}
.hero-dim{color:var(--muted)}
.hero em{font-style:italic;color:var(--amber)}
.hero-sub{font-family:var(--f-story);font-size:var(--t-body);line-height:1.6;color:var(--muted);max-width:58ch}
.hero-sub em{font-style:italic;color:var(--fg)}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:30px}
.btn-start{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:15px 26px;border:0;border-radius:10px;background:var(--amber);color:var(--on-accent);font-family:var(--f-ui);font-weight:600;font-size:var(--t-ui);line-height:1.2;text-decoration:none;white-space:nowrap;cursor:pointer;box-shadow:none;transition:box-shadow .2s}
.btn-start:hover{color:var(--on-accent);text-decoration:none;filter:brightness(1.08)}
.btn-start:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.btn-start span{font-size:var(--t-body);line-height:1}
.hero-hint{font-size:var(--t-sm);line-height:1.6;color:var(--muted);max-width:34ch}

/* the night bar: tonight's minutes as one row of segments, then a legend */
.night-bar{margin-top:52px}
.nb-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:14px;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nb-head span + span{font-size:var(--t-xs);letter-spacing:.04em;text-transform:none}
.nb-track{display:flex;gap:4px;height:8px}
.nb-track .seg{flex:1 1 0;min-width:3px;height:100%;border-radius:2px;background:var(--line)}
.nb-track .seg-cold{background:rgba(149,157,164,.32)}
.nb-track .seg-dl{background:var(--amber);box-shadow:0 0 12px rgba(226,162,60,.3)}
.nb-track .seg-lt{background:rgba(95,179,201,.42)}
.nb-track .seg-build{background:rgba(116,194,142,.42)}
.nb-track .seg-spare{background:transparent;border:1px dashed var(--dash)}
.nb-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font-size:var(--t-xs);color:var(--muted)}
.nb-key{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nb-key::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--line)}
.nb-key b{font-weight:500;color:var(--muted)}
.nb-key.seg-cold::before{background:rgba(149,157,164,.32)}
.nb-key.seg-dl::before{background:var(--amber)}
.nb-key.seg-dl b{color:var(--amber)}
.nb-key.seg-lt::before{background:rgba(95,179,201,.42)}
.nb-key.seg-lt b{color:var(--cyan)}
.nb-key.seg-build::before{background:rgba(116,194,142,.42)}
.nb-key.seg-build b{color:var(--green)}
.nb-key.seg-spare::before{background:none;border:1px dashed var(--dash)}

/* lists: cold cases due, next case, then */
.list-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:48px 0 4px;font-family:var(--f-mono);font-size:var(--t-xs);font-weight:500;line-height:1.6;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.list-h span{letter-spacing:.04em;color:var(--muted)}
.queue{list-style:none;margin:0;padding:0}
.q-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:18px;align-items:baseline;padding:11px 0;border-top:1px solid var(--hair)}
.q-code{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:500;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums}
[data-course="lt"] .q-code{color:var(--cyan)}
.q-main{min-width:0}
.q-title{font-family:var(--f-story);font-size:var(--t-lg);line-height:1.3;color:var(--fg)}
.q-title a{color:var(--fg);text-decoration:none}
.q-title a:hover{text-decoration:underline;text-decoration-color:var(--line)}
.q-set{margin-left:10px;font-family:var(--f-story);font-style:italic;font-size:var(--t-ui);color:var(--muted)}
.q-tag{display:inline-block;margin-left:10px;font-family:var(--f-ui);font-size:var(--t-xs);letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.q-row[data-kind="cold"] .q-tag{color:var(--red)}
.q-min{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.q-go{font-size:var(--t-xs);color:var(--muted);text-decoration:none;white-space:nowrap}
.q-go:hover{color:var(--fg);text-decoration:none}
.next-case{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;grid-template-areas:". eye . ." "code main min go";gap:4px 18px;align-items:center;margin:14px -12px;padding:20px 12px;border:1px solid rgba(226,162,60,.32);border-radius:12px;background:rgba(226,162,60,.05)}
.nc-eyebrow{grid-area:eye;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.next-case > .q-code{grid-area:code}
.nc-main{grid-area:main;min-width:0}
.nc-title{font-family:var(--f-story);font-weight:400;font-size:var(--t-xl);line-height:1.2;letter-spacing:-.01em}
.nc-title a{color:var(--fg);text-decoration:none}
.nc-title a:hover{text-decoration:underline;text-decoration-color:var(--line)}
.nc-set{margin-top:4px;font-family:var(--f-story);font-style:italic;font-size:var(--t-body);color:var(--muted)}
.next-case > .q-min{grid-area:min}
.nc-go{grid-area:go;white-space:nowrap}
.next-case[data-course="lt"]{border-color:rgba(95,179,201,.32);background:rgba(95,179,201,.05)}
.next-case[data-course="lt"] .nc-eyebrow{color:var(--cyan)}
.next-case[data-course="lt"] .btn-primary{border-color:rgba(95,179,201,.55);color:var(--cyan);background:var(--cyan-dim)}
.empty-line{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:var(--t-xs);color:var(--muted)}
.empty-line::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--faint)}

@media (max-width: 699px){
  .tonight{padding-top:24px;padding-bottom:84px}
  .status-strip{gap:6px 16px}
  .ss-new{margin-left:0}
  .hero{line-height:1.1;margin:22px 0 12px}
  .hero-actions{margin-top:18px}
  /* Start shift: a full-width button pinned to the bottom (fixed, since its own row is too short to stick in) */
  .btn-start{position:fixed;z-index:30;left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:15px 20px}
  .hero-actions::before{content:"";position:fixed;z-index:29;left:0;right:0;bottom:0;height:calc(96px + env(safe-area-inset-bottom,0px));background:linear-gradient(var(--bg-fade),var(--bg-deep) 40%);pointer-events:none}
  .night-bar{margin-top:30px}
  .nb-track{gap:3px;height:7px}
  .list-h{margin-top:32px}
  .q-row{grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px}
  .q-set,.q-tag{display:block;margin-left:0}
  .q-set{margin-top:2px}
  .q-go{grid-column:2 / -1;justify-self:start}
  .next-case{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"eye code" "main main" "min go";gap:6px 12px;margin:12px -4px;padding:16px 12px;background:rgba(226,162,60,.05)}
  .next-case > .q-code{justify-self:end}
}

/* ---------- First shift: a sentence you fill in (v2.0.0) ---------- */
.fs{padding-top:44px}
.fs-title{margin-top:10px;font-family:var(--f-story);font-weight:400;font-size:var(--t-3xl);line-height:1.06;letter-spacing:-.02em;color:var(--fg)}
.fs-lede{margin-top:12px;font-family:var(--f-story);font-size:var(--t-body);line-height:1.55;color:var(--muted);max-width:58ch}
.fs-form{margin-top:10px}
.fs-q{margin:34px 0 0}
.fs-q + .fs-q{padding-top:30px;border-top:1px solid var(--hair)}
.fs-sentence{font-family:var(--f-story);font-weight:400;font-size:var(--t-lg);line-height:1.35;letter-spacing:-.01em;color:var(--fg)}
.fs-val{font-weight:500;color:var(--amber);font-variant-numeric:tabular-nums}
.fs-date-wrap{position:relative;display:inline-block;color:var(--amber);border-bottom:1px dashed var(--amber);line-height:1.2;cursor:pointer}
.fs-date-wrap .fs-date{position:absolute;inset:0;width:100%;height:100%;min-width:0;margin:0;padding:0;border:0;background:none;opacity:0;font-size:var(--t-body);cursor:pointer;-webkit-appearance:none;appearance:none}
.fs-date-wrap .fs-date::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;margin:0;padding:0;cursor:pointer}
.fs-date-wrap:has(.fs-date:focus-visible){outline:2px solid var(--amber);outline-offset:4px;border-radius:2px}
.fs-chips{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fs-chips input,.fs-plans input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.fs-chips label{display:inline-flex;align-items:center;padding:8px 14px;border:1px solid var(--hair-2);border-radius:999px;font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.fs-chips label:hover{border-color:var(--muted)}
.fs-chips input:checked + label{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.fs-chips input:focus-visible + label,.fs-plans input:focus-visible + label{outline:2px solid var(--amber);outline-offset:2px}
.field .fs-chips{margin-top:2px}
.fs-plans{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.fs-plan{display:flex;min-width:0}
.fs-plan label{flex:1 1 auto;display:grid;gap:4px;align-content:start;padding:14px 16px;border:1px solid var(--hair-2);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.fs-plan label:hover{border-color:var(--muted)}
.fs-plan-name{font-family:var(--f-ui);font-size:var(--t-ui);line-height:1.3;color:var(--fg)}
.fs-plan-help{font-size:var(--t-xs);line-height:1.5;color:var(--muted)}
.fs-plan input:checked + label{border-color:var(--amber);background:var(--amber-dim)}
.fs-plan input:checked + label .fs-plan-name{color:var(--amber)}
.fs-fit{display:flex;align-items:baseline;gap:10px;margin-top:34px;font-family:var(--f-ui);font-size:var(--t-xs);line-height:1.6;color:var(--muted);max-width:70ch}
.fs-fit::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--green);transform:translateY(-1px)}
.fs-fit[data-fit="tight"]::before{background:var(--amber)}
